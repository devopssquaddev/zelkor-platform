# CE S-gate manifest: every CE CLAIM S-id with an L3/L7 level, the live test files that prove it,
# and the env the lab must export so they run instead of skipping. Read by run_s_gate.sh (via
# s_gate.py). A listed file that does not exist yet, or a missing env var, is a GAP for that S-id
# and blocks the tag; it is never silently dropped. Offline L1/L2 cases run in PR CI (tests.yml).
#
# profiles (default [full]): the installs an S-id is gated on. full = the Path B S-gate run
# (release-evidence/<tag>/s-gate.junit.xml); perimeter = the perimeter lab run
# (release-evidence/<tag>/s-gate-perimeter.junit.xml). A promise that holds on both installs is
# gated on both; `s_gate.py evidence` fails the release when either file, or an S-id of its
# profile, is absent.
# Lab-specific values (hosts, keys, graph ids) come from the lab env file, never from this repo.
global_env: [KUBECONTEXT, GATEWAY_BASE_URL, ZELKOR_TEST_TOKENS, ZELKOR_SGATE_VERSION,
             ZELKOR_SGATE_GIT_SHA, ZELKOR_SGATE_RUN_ID, ZELKOR_UAT_WINDOW_START]
# Runs last: the window sweep (S-14 container-log part and UAT-17).
last: [tests/test_uat_window_hygiene.py]
s_ids:
