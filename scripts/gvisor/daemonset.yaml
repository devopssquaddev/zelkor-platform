# Privileged node installer — idempotent; safe to leave running on new nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zelkor-gvisor-installer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: zelkor-gvisor-installer
    app.kubernetes.io/component: gvisor-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zelkor-gvisor-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zelkor-gvisor-installer
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: true
      containers:
        - name: install
          image: alpine:3.22
          securityContext:
            privileged: true
          env:
            - name: GVISOR_RELEASE
              value: "20260817"
            - name: HOST_ROOT
              value: /host
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache curl bash >/dev/null
              while true; do
                bash /scripts/install-on-node.sh && sleep 3600 || sleep 30
              done
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: install-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: install-script
          configMap:
            name: zelkor-gvisor-install-script
            defaultMode: 0555
