# CE-19a/b: build, push, sign, SBOM and attest ONE first-party image by digest.
# A composite action (not a reusable workflow) so the keyless signing identity stays
# .github/workflows/release.yml@refs/tags/vX.Y.Z-ce, which the chart policy and `zelkor verify` pin.
name: release-image
description: Build and push one zelkor-* image from scripts/build-images.sh, then cosign-sign it and attest SBOM + SLSA provenance.

inputs:
  image:
    description: Image name from scripts/build-images.sh --list
    required: true
  version:
    description: CE version X.Y.Z (already checked against the tag)
    required: true
  registry:
    description: Registry prefix
    default: ghcr.io/devopssquaddev
  token:
    description: Token with packages:write
    required: true

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v2.6.5
    - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      with:
        version: v0.22.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push ${{ inputs.image }}
      id: build
      shell: bash
      env:
        IMAGES: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.version }}
        IMAGE_REGISTRY: ${{ inputs.registry }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        mkdir -p sboms release-digests
        meta=$(scripts/build-images.sh --list-json | jq -c --arg n "$IMAGES" '.[] | select(.name == $n)')
        [ -n "$meta" ] || { echo "::error::$IMAGES is not in scripts/build-images.sh"; exit 1; }
        repo="${IMAGE_REGISTRY}/${IMAGES}"
        base=$(jq -r .base <<<"$meta")
        if [ -n "$base" ]; then
          # Build FROM the base digest this run just signed, not a mutable tag.
          BASE_IMAGE_REF="${IMAGE_REGISTRY}/${base}@$(crane digest "${IMAGE_REGISTRY}/${base}:${IMAGE_TAG}")"
          export BASE_IMAGE_REF
        fi
        if existing=$(crane digest "${repo}:${IMAGE_TAG}" 2>/dev/null); then
          if [ "$RUN_ATTEMPT" = "1" ]; then
            echo "::error::${repo}:${IMAGE_TAG} already exists ($existing); published semver tags are immutable, release a new PATCH"
            exit 1
          fi
          echo "re-run attempt ${RUN_ATTEMPT}: ${repo}:${IMAGE_TAG} exists, signing ${existing} again"
        else
          scripts/build-images.sh --push
        fi
        {
          echo "repo=${repo}"
          echo "digest=$(crane digest "${repo}:${IMAGE_TAG}")"
          echo "dockerfile=$(jq -r .dockerfile <<<"$meta")"
        } >> "$GITHUB_OUTPUT"

    - name: Sign (keyless, workflow identity)
      shell: bash
      env:
        REF: ${{ steps.build.outputs.repo }}@${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$REF"

    - name: SBOM (syft, SPDX)
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ steps.build.outputs.repo }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: sboms/${{ inputs.image }}.spdx.json
        syft-version: v1.57.1
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM and SLSA provenance
      shell: bash
      env:
        REF: ${{ steps.build.outputs.repo }}@${{ steps.build.outputs.digest }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGGED: ${{ steps.build.outputs.repo }}:${{ inputs.version }}
        DOCKERFILE: ${{ steps.build.outputs.dockerfile }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        cosign attest --yes --type spdxjson --predicate "sboms/${IMAGE}.spdx.json" "$REF"
        python3 scripts/release/release_attest.py provenance --tag "$TAG" --artifact "$REF" \
          --dockerfile "$DOCKERFILE" --out "provenance-${IMAGE}.json"
        cosign attest --yes --type slsaprovenance1 --predicate "provenance-${IMAGE}.json" "$REF"
        mkdir -p release-digests
        jq -n --arg name "$IMAGE" --arg ref "$TAGGED" --arg digest "$DIGEST" \
          '{name: $name, ref: $ref, digest: $digest}' > "release-digests/${IMAGE}.json"

    - name: GitHub build provenance (gh attestation verify)
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.build.outputs.repo }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-image-${{ inputs.image }}
        path: |
          release-digests/${{ inputs.image }}.json
          sboms/${{ inputs.image }}.spdx.json
        if-no-files-found: error
