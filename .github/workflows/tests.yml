# L1 + L2 on every PR: the whole offline suite (unit, render, CLI, install dry-run, release and S-id
# unit tests). Live tests self-skip: no cluster, no secrets, no lab env. Required to merge.
# Coverage audit 2026-11-18 G1. Static checks that need tools (pict drift, shellcheck) run here too,
# so they fail instead of skipping.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Install shellcheck and pict (pinned)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q cmake
          # shellcheck from the upstream release: apt versions differ per runner image
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2
          git clone -q --depth 1 --branch v3.7.4 https://github.com/microsoft/pict.git "$RUNNER_TEMP/pict"
          cmake -S "$RUNNER_TEMP/pict" -B "$RUNNER_TEMP/pict/build" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$RUNNER_TEMP/pict/build" --parallel >/dev/null
          sudo install "$(find "$RUNNER_TEMP/pict/build" -type f -name pict -perm -u+x | head -1)" /usr/local/bin/pict
          (pict || true) | head -1
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e ./cli
      - name: Offline suite (live tests self-skip)
        env:
          KUBECONFIG: ${{ runner.temp }}/no-cluster
        run: |
          : > "$KUBECONFIG"
          pytest tests/ -o addopts="" -q -rfE
