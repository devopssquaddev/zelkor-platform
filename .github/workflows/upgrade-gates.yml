# CE-19g release gates on kind, published per release:
#   upgrade-rollback  N-1 -> N upgrade and `helm rollback` with zero dropped requests
#   retry-storm       30 min of 100% provider failures; Envoy memory flat under a published ceiling
# Thresholds: scripts/release/gate-thresholds.json. Logic lives in scripts/release/*; YAML stays thin.
name: upgrade-gates

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to gate (vX.Y.Z-ce)
        required: true
      gate:
        description: Which gate to run
        type: choice
        default: both
        options: [both, upgrade-rollback, retry-storm]

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ce$ ]] || { echo "::error::not a CE tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  upgrade-rollback:
    needs: [resolve]
    if: ${{ inputs.gate != 'retry-storm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - name: N-1 -> N upgrade and rollback under load
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/release/upgrade_gate.sh "$TAG"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-upgrade-rollback
          path: gate-results/*.json
          if-no-files-found: warn

  retry-storm:
    needs: [resolve]
    if: ${{ inputs.gate != 'upgrade-rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - name: 30-minute retry storm against an always-failing provider
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/release/retry_storm_gate.sh "$TAG"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-retry-storm
          path: |
            gate-results/*.json
            gate-results/*.csv
          if-no-files-found: warn

  publish:
    needs: [resolve, upgrade-rollback, retry-storm]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-*
          merge-multiple: true
          path: gate-results
      - name: Attach gate results to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/release/publish_gates.sh "$TAG" gate-results
