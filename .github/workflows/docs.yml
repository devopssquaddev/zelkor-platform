# Docs contract: frontmatter, llms.txt, Helm values schemas, and a full site build.
# Offline only: no cluster, no secrets.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "charts/*/values.yaml"
      - "charts/*/values.schema.json"
      - "tests/test_docs_frontmatter.py"
      - "tests/test_llms_txt.py"
      - "tests/test_helm_values_schema.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "charts/*/values.yaml"
      - "charts/*/values.schema.json"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Docs, llms.txt and schema tests
        run: pytest tests/test_docs_frontmatter.py tests/test_llms_txt.py tests/test_helm_values_schema.py
      - name: Build site (fails if llms.txt exceeds 2,000 tokens)
        run: npm run docs:build
        working-directory: website
