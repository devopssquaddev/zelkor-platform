# Self-hosted Renovate for the Zelkor dev automation harness (Loop 2 currency).
# Config: renovate.json (third-party pins only; first-party zelkor-* and the CE triple excluded).
# The Mend GitHub App is NOT installed; this workflow is the only Renovate runner.
# Requires repo/org secret RENOVATE_TOKEN (a GitHub App installation token or a scoped PAT with
# contents:write + pull-requests:write). Until that secret exists, the job no-ops with a notice.
name: renovate

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC — the dev-harness Loop 2 slot
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [debug, info]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard on missing token
        id: guard
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::warning::RENOVATE_TOKEN is not set; skipping. Provision it to enable Loop 2."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Renovate
        if: steps.guard.outputs.run == 'true'
        uses: renovatebot/github-action@v40.3.6
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
        with:
          configurationFile: renovate.json
