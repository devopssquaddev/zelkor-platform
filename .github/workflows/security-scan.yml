# CE-8a image CVE scan (Trivy) + CE-8b Python dependency audit (pip-audit) for the dev automation
# harness (Loop 1 patch). This is the scan FEED the harness reads; a green scan is NEVER recorded
# as an S-id PASS (the S-gate is a separate process — internal/requirements/security-assurance).
# Findings become a harness PR or a GAP row, not a release gate here.
# Verdict: findings are written to the job summary on every run. Scheduled and manual runs fail
# red on a finding; pull_request runs stay soft so an unrelated pin PR is not blocked.
name: security-scan

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC — the dev-harness Loop 1 slot
  workflow_dispatch: {}
  pull_request:
    paths:
      - "images/**/requirements.txt"
      - "images/**/pip-audit-ignore.txt"
      - "images/**/Dockerfile"
      - "charts/zelkor-platform/values.yaml"
      - ".github/workflows/security-scan.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    # CE-8b: audit the pinned Python deps of every first-party image build context.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit requirements
        run: |
          status=0
          echo "## pip-audit" >> "$GITHUB_STEP_SUMMARY"
          today=$(date -u +%F)
          for req in images/*/requirements.txt; do
            echo "::group::pip-audit ${req}"
            # <dir>/pip-audit-ignore.txt: "<advisory id> <review-by YYYY-MM-DD> <reason>" per line,
            # for advisories with no fixed release. A passed review-by date fails the run.
            ignore=()
            list="$(dirname "${req}")/pip-audit-ignore.txt"
            if [ -f "${list}" ]; then
              while read -r id until _; do
                case "${id}" in ""|"#"*) continue ;; esac
                if [[ "${until}" < "${today}" ]]; then
                  status=1
                  echo "::error file=${list}::${id} ignore expired on ${until}; re-check for a fix or renew the date"
                fi
                ignore+=(--ignore-vuln "${id}")
              done < "${list}"
            fi
            rc=0
            out=$(pip-audit -r "${req}" --strict -f markdown "${ignore[@]}" 2>&1) || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              status=1
              echo "::error file=${req}::pip-audit reported findings"
              { echo "### ${req}"; echo; echo "$out"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$status" -eq 0 ] && echo "No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          # Loop 1 reads the findings; a CVE here becomes a PR or a GAP, not a release gate.
          exit $status
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  trivy-images:
    # CE-8a: scan the first-party GHCR images at the chart appVersion. Fail on a CRITICAL in OUR
    # image layers (roadmap CE-8a), not on every transitive base-image CVE.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - zelkor-mcp
          - zelkor-aegra
          - zelkor-aegra-cli
          - zelkor-aegra-deep
          - zelkor-guardrails
          - zelkor-sandbox-worker
          - zelkor-sidecar
          - zelkor-langfuse-seed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve CE image tag from Chart.yaml
        id: tag
        run: |
          tag=$(awk -F'[:"[:space:]]+' '/^appVersion:/{print $2}' charts/zelkor-platform/Chart.yaml)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/devopssquaddev/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy.txt
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
      - name: Write Trivy findings to job summary
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          cat trivy.txt 2>/dev/null || true
          {
            echo "## Trivy ${IMAGE}"
            echo
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no Trivy output (scan did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
