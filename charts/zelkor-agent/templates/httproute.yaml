{{- $sr := .Values.sharedRoute | default dict }}
{{- $intent := .Values.workload.intent | default dict }}
{{- $timeout := $intent.timeout | default "" | toString | trim }}
{{- $gatewayName := include "zelkor-agent.sharedRouteGatewayName" . }}
{{- if and $sr.enabled $sr.host $gatewayName }}
{{- $graphIds := .Values.graphIds | default list }}
{{- if and (not $graphIds) .Values.graphId }}
{{- $graphIds = list .Values.graphId }}
{{- end }}
{{- if not $graphIds }}
{{- fail "graphId or graphIds must be set (the independently released graph id(s))" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "zelkor-agent.fullname" . }}-route
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName | quote }}
      namespace: {{ $sr.gatewayNamespace | default .Release.Namespace | quote }}
  hostnames:
    - {{ $sr.host | quote }}
  rules:
    - matches:
        {{- if $sr.asDefault }}
        - path:
            type: PathPrefix
            value: /
        {{- else }}
        {{- range $graphIds }}
        - headers:
            - name: X-Graph-ID
              type: Exact
              value: {{ . | quote }}
        - queryParams:
            - name: graph_id
              type: Exact
              value: {{ . | quote }}
        {{- end }}
        {{- end }}
      backendRefs:
        - name: {{ include "zelkor-agent.fullname" . }}
          port: 8000
      timeouts:
        request: {{ if $timeout }}{{ $timeout | quote }}{{ else }}0s{{ end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "zelkor-agent.fullname" . }}-sse
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "zelkor-agent.fullname" . }}-route
  mergeType: StrategicMerge
  timeout:
    http:
      requestTimeout: {{ if $timeout }}{{ $timeout | quote }}{{ else }}0s{{ end }}
      maxStreamDuration: 0s
      streamIdleTimeout: {{ if $timeout }}{{ $timeout | quote }}{{ else }}1h{{ end }}
{{- end }}
