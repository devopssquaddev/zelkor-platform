{{- $np := ((.Values.security).networkPolicies | default dict) -}}
{{- if $np.enabled }}
{{- $fullname := include "zelkor-agent.fullname" . }}
{{- $pns := include "zelkor-agent.platformNamespace" . }}
{{- $cross := eq (include "zelkor-agent.crossNamespace" .) "true" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-egress
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
    zelkor.io/intent: security.networkPolicies
spec:
  podSelector:
    matchLabels:
      {{- include "zelkor-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: guardrails
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: langfuse
      ports:
        - protocol: TCP
          port: 3000
    {{- if $cross }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $pns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: valkey
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-ingress
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
    zelkor.io/intent: security.networkPolicies
spec:
  podSelector:
    matchLabels:
      {{- include "zelkor-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        {{- range ($np.hostNetworkGatewayCIDRs | default list) }}
        {{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" (toString .)) }}
        {{- fail (printf "security.networkPolicies.hostNetworkGatewayCIDRs entries must be single node addresses (x.x.x.x/32), got %q" (toString .)) }}
        {{- end }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
