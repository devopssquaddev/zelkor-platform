{{- if (.Values.autoscaling).enabled }}
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "zelkor-agent.fullname" . }}
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "zelkor-agent.fullname" . }}
  minReplicas: {{ int (.Values.autoscaling.minReplicas | default 2) }}
  maxReplicas: {{ int (.Values.autoscaling.maxReplicas | default 8) }}
  targetCPUUtilizationPercentage: {{ int (.Values.autoscaling.cpuUtilization | default 70) }}
{{- end }}
