{{- if ((.Values.observability).serviceMonitor).enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "zelkor-agent.fullname" . }}
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
    {{- with ((.Values.observability).serviceMonitor).labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "zelkor-agent.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ ((.Values.observability).serviceMonitor).interval | default "30s" | quote }}
{{- end }}
