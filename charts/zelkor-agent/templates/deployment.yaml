{{- $graphId := include "zelkor-agent.primaryGraphId" . }}
{{- $intent := .Values.workload.intent | default dict }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-agent.fullname" . }}
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    {{- include "zelkor-agent.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-agent.fullname" . }}
  labels:
    {{- include "zelkor-agent.labels" . | nindent 4 }}
spec:
  {{- if not ((.Values.autoscaling).enabled | default false) }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zelkor-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zelkor-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 35 }}
      containers:
        - name: agent
          image: {{ include "zelkor-agent.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          workingDir: /app
          command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          {{- $otelSecret := include "zelkor-agent.langfuseOtelSecretName" . -}}
          {{- if and $otelSecret (not .Values.platform.langfuseBaseUrl) }}
          envFrom:
            - secretRef:
                name: {{ $otelSecret | quote }}
                optional: true
          {{- end }}
          env:
            {{- include "zelkor-agent.logEnv" . | nindent 12 }}
            - name: LOG_EXCLUDE_PATHS
              value: "/health,/live,/ready"
            - name: AUTH_DEV_TOKENS_ENABLED
              value: {{ ((.Values.auth.devTokens).enabled | default false) | quote }}
            - name: AUTH_DEV_TOKEN_PREFIX
              value: {{ ((.Values.auth.devTokens).prefix | default "") | quote }}
            - name: AUTH_TRUST_TENANT_HEADER
              value: {{ (.Values.auth.trustTenantHeader | default false) | quote }}
            - name: AUTH_JWT_SECRET
              value: {{ (.Values.auth.jwtSecret | default "") | quote }}
            - name: DATABASE_URL
              value: {{ required "platform.databaseUrl must be set (shared Aegra checkpointer DSN)" .Values.platform.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.platform.valkeyUrl | quote }}
            - name: REDIS_BROKER_ENABLED
              value: "true"
            - name: REDIS_CHANNEL_PREFIX
              value: {{ include "zelkor-agent.redisChannelPrefix" . | quote }}
            - name: WORKER_QUEUE_KEY
              value: {{ include "zelkor-agent.workerQueueKey" . | quote }}
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
            - name: WORKER_COUNT
              value: {{ (.Values.workerCount | default 3) | quote }}
            - name: N_JOBS_PER_WORKER
              value: {{ (.Values.nJobsPerWorker | default 10) | quote }}
            - name: WORKER_DRAIN_TIMEOUT
              value: {{ (.Values.workerDrainTimeout | default 30) | quote }}
            {{- if .Values.aegraConfig }}
            - name: AEGRA_CONFIG
              value: {{ .Values.aegraConfig | quote }}
            {{- end }}
            - name: OPENAI_BASE_URL
              value: {{ include "zelkor-agent.openaiBaseUrl" . | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.platform.consumerKey | quote }}
            - name: AI_GATEWAY_URL
              value: {{ include "zelkor-agent.openaiBaseUrl" . | quote }}
            - name: MCP_URL
              value: {{ include "zelkor-agent.mcpUrl" . | quote }}
            - name: ZELKOR_RUN_TIMEOUT
              value: {{ ($intent.timeout | default "") | quote }}
            - name: ZELKOR_MAX_TOKENS
              value: {{ ($intent.maxTokens | default 0) | quote }}
            - name: ZELKOR_APPROVAL_THRESHOLD
              value: {{ (($intent.approval).threshold | default "") | quote }}
            - name: ZELKOR_APPROVAL_REQUIRED
              value: {{ ternary "true" "false" (($intent.approval).enabled | default false) | quote }}
            - name: MCP_INJECT_ENABLED
              value: {{ .Values.platform.mcpInject | quote }}
            {{- if .Values.platform.mcpInjectToolPrefixes }}
            - name: MCP_INJECT_TOOL_PREFIXES
              value: {{ .Values.platform.mcpInjectToolPrefixes | quote }}
            {{- end }}
            {{- if .Values.platform.defaultLlmModel }}
            - name: DEFAULT_LLM_MODEL
              value: {{ .Values.platform.defaultLlmModel | quote }}
            {{- end }}
            {{- include "zelkor-agent.langfuseEnv" . | nindent 12 }}
            - name: ZELKOR_GRAPH_ID
              value: {{ $graphId | quote }}
            - name: ENABLE_PROMETHEUS_METRICS
              value: {{ ternary "true" "false" ((.Values.observability.serviceMonitor).enabled | default false) | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          {{- include "zelkor-agent.containerProbes" (dict "root" . "values" .Values) | nindent 10 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
