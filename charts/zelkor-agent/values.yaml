# Helper chart: one ClusterIP Aegra worker. Not the platform front door.
# Self-register: HTTPRoute when sharedRoute.host + sharedRoute.gatewayName are set.
# Do not edit platform aegra.workers as a second step. Overlay workers are optional fallback.

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

logging:
  level: INFO
  format: json

graphId: ""
# Several ids on one Deployment (fat multi-graph image). Used when graphId is empty.
graphIds: []

# Path to aegra.json inside the image. Override for multi-config images.
aegraConfig: "/app/aegra.json"

# Shared-host registration. Empty host or gatewayName = no HTTPRoute from this chart
# unless platform.releaseName is set (then gatewayName defaults to {release}-gateway).
# asDefault: path `/` catch-all (topology 1). false = X-Graph-ID / ?graph_id= matches.
sharedRoute:
  enabled: true
  gatewayName: ""
  gatewayNamespace: ""
  host: ""
  asDefault: false

# REDIS_CHANNEL_PREFIX + WORKER_QUEUE_KEY on the shared platform Valkey.
# Empty prefix → aegra:<Deployment fullname>. Do not deploy a second Valkey.
redis:
  prefix: ""
  channelPrefix: ""
  queueKey: ""

image:
  repository: ghcr.io/devopssquaddev/zelkor-aegra
  tag: "2.4.2"
  digest: ""
  pullPolicy: ""

# Agent runtime (CE-14). aegra: Aegra / LangGraph / Deep Agents in-process (unchanged).
# a2a: any image serving A2A on 127.0.0.1:8080 (e.g. zelkor-runtime-pydantic-ai, zelkor-runtime-crewai).
# opencode: zelkor-runtime-opencode. Non-aegra runtimes run behind zelkor-sidecar, which owns
# :8000, tenant auth, threads/runs and the 127.0.0.1:8001 LLM/MCP egress; the runtime
# container gets no DATABASE_URL, REDIS_URL, provider or consumer key.
runtime: aegra

sidecar:
  image:
    repository: ghcr.io/devopssquaddev/zelkor-sidecar
    tag: "2.4.2"
    digest: ""
    pullPolicy: ""
  # Non-stream the LLM call when it carries tools (NeMo intercept rejects tools + stream);
  # the sidecar re-streams the answer. Same behaviour as the Aegra path.
  nemoToolsNoStream: true
  dbPoolSize: 5
  a2a:
    # Northbound A2A (Agent Card + JSON-RPC) on :8000 next to Agent Protocol.
    enabled: false
    # Card URL. Empty: https://{sharedRoute.host}/a2a?graph_id={graphId}
    publicUrl: ""
  resources: {}
  runtimeResources: {}

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70

observability:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s

workerCount: 3
nJobsPerWorker: 10
workerDrainTimeout: 30
terminationGracePeriodSeconds: 35

security:
  networkPolicies:
    enabled: false
    # Kind only: node addresses (/32) of a hostNetwork Envoy gateway. Its traffic does not
    # come from the envoy-gateway-system namespace, so the ingress rule below would drop it.
    # `zelkor deploy` fills this on kind clusters; leave empty everywhere else.
    hostNetworkGatewayCIDRs: []

platform:
  # Platform Helm release namespace. Empty → this release namespace.
  # CLI sets this when `zelkor deploy --namespace` differs from the platform env.
  namespace: ""
  # Platform Helm release name. When set and URLs below are empty, constructs
  # {release}-ai-gateway / {release}-mcp / {release}-langfuse and
  # sharedRoute {release}-gateway. GitOps workers envFrom {release}-langfuse-otel.
  releaseName: ""
  openaiBaseUrl: ""
  consumerKey: ""
  mcpUrl: ""
  # Existing platform Aegra checkpointer (typically .../aegra). Do not create a new DB.
  databaseUrl: ""
  # Existing platform Valkey Service. Isolate agents with redis.prefix.
  valkeyUrl: ""
  mcpInject: true
  # Secret with key `token` (RS256 tenant JWT) for startup MCP tools/list when no inbound bearer.
  mcpAuthTokenSecret: ""
  mcpAuthTokenSecretKey: token
  # Optional comma-separated MCP tool prefixes when graph modules omit MCP_INJECT_PREFIXES.
  mcpInjectToolPrefixes: ""
  # CE-9: with no MCP_INJECT_TOOLS / prefixes the agent binds no tools. true binds every
  # tool the tenant's MCP gateway lists (natives and extras). Not a security boundary.
  mcpInjectAllowAll: false
  defaultLlmModel: ""
  # Empty + releaseName → http://{release}-langfuse:3000 and envFrom {release}-langfuse-otel.
  langfuseBaseUrl: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""
  otelTargets: ""

# JWT tenant auth (same contract as platform.tenants.jwt). When releaseName is set,
# jwksConfigMap defaults to {releaseName}-tenant-jwks in the platform namespace.
auth:
  issuer: ""
  audiences: []
  jwksConfigMap: ""
  jwksUri: ""
  tenantClaims: []
  orgMappings: {}

# Extra container env (e.g. DEFAULT_LLM_MODEL, QDRANT_COLLECTION for a graph prompt).
extraEnv: []

# Empty omits the field. Catalog overlays set gvisor.
runtimeClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Kubernetes probes (zelkor-aegra / zelkor-aegra-deep): GET /health, /live, /ready on port 8000.
# Override timing only; set a probe to null to omit (advanced debugging).
startupProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 18
livenessProbe:
  httpGet:
    path: /live
    port: 8000
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

workload:
  intent:
    timeout: ""
    maxTokens: 0
    approval:
      enabled: false
      threshold: ""
