# Raw Kubernetes objects rendered alongside generated manifests (escape hatch).
extraManifests: []

# V2 intent API: platform.*, workspace.*, workload.* (compiled to internal templates at render).
# Substrate keys (postgresql, gateway, databases, security.sandbox, …) stay at the root.
#
# First-party images published as ghcr.io/devopssquaddev/zelkor-*:2.0.0. Kind uses tag: "dev" in profiles/values-local.yaml.

global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  initContainerImage: busybox:1.37
platform:
  mTLS:
    enabled: false
  tenants:
    sso:
      enabled: false
    jwtSecret: ''
    devTokens:
      enabled: false
      prefix: ''
    trustTenantHeader: false
    orgMappings: {}
  telemetry:
    level: INFO
    format: json
    aegraOtelTargets: ''
    nemoOtel:
      enabled: false
      captureContent: false
    langfuse:
      enabled: true
      publicHttpRoute:
        enabled: false
      replicaCount: 1
      highAvailability:
        minReplicas: 1
      image:
        repository: langfuse/langfuse
        tag: 4.24.0
      worker:
        enabled: true
        replicaCount: 1
        image:
          repository: langfuse/langfuse-worker
          tag: 4.24.0
      s3:
        bucket: langfuse
        region: auto
      migration:
        v4WriteMode: events_only
        enableHistoricBackfill: false
        nativeOtelBehaviour: direct
        allowPreviewOptIn: true
      surfaces:
        llmConnection:
          enabled: false
          name: zelkor-ai-gateway
          models: []
        tools:
          seedFromMcp: false
          seedTenant: seed
          authToken: ''
        evaluators:
          seedCode: false
        image:
          repository: ghcr.io/devopssquaddev/zelkor-langfuse-seed
          tag: 2.0.0
          digest: ''
      extraProjects: []
      nextauthUrl: ''
      nextauthSecret: ''
      salt: ''
      encryptionKey: ''
      admin:
        enabled: true
        existingSecret: ''
        email: ''
        name: Admin
        password: ''
      init:
        enabled: false
        existingSecret: ''
        orgId: ''
        orgName: ''
        projectId: ''
        projectName: ''
        projectPublicKey: ''
        projectSecretKey: ''
        userEmail: ''
        userName: ''
        userPassword: ''
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      startupProbe:
        httpGet:
          path: "/api/public/health"
          port: 3000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 45
      livenessProbe:
        httpGet:
          path: "/api/public/health"
          port: 3000
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/api/public/health"
          port: 3000
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
workspace:
  models:
    enabled: true
    consumerKey: ''
    defaultModel: ''
    internalUrl: ''
    inClusterService:
      enabled: true
      port: 80
      targetHost: ''
    providers:
      openai:
        apiKey: ''
        models:
        - "*"
      anthropic:
        apiKey: ''
        models:
        - "*"
      gemini:
        apiKey: ''
        models:
        - "*"
      ollamaLocal:
        host: ''
        models:
        - "*"
      ollamaCloud:
        apiKey: ''
        models:
        - "*"
      azure:
        apiKey: ''
        endpoint: ''
        apiVersion: 2025-01-01-preview
        models:
        - "*"
      bedrock:
        region: us-east-1
        accessKeyId: ''
        secretAccessKey: ''
