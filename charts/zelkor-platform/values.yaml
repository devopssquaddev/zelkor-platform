# Zelkor Community Edition — production chart defaults.
# Local kind: ./install.sh applies profiles/values-local.yaml (outside this chart).
# Demo overlays: examples/<name>/chart/values-platform-overlay.yaml when INSTALL_EXAMPLES=true.
#
# This file ships no passwords, API keys, localhost hosts, or Docker Desktop endpoints.
# Set secrets and hostnames in a customer overlay or existing Secret.
#
# First-party images (Aegra, MCP, guardrails, sandbox worker) are published to
# GHCR as ghcr.io/devopssquaddev/zelkor-*:dev until CI tags semver. Override
# repository, tag, or digest per environment. Pin digest in production.

global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  initContainerImage: busybox:1.37

databases:
  mode: in-cluster-basic  # in-cluster-basic (Gate A) | operators (Gate B)

highAvailability:
  enabled: false  # Gate B production toggle

security:
  mTLS:
    enabled: false
  sandbox:
    enabled: true
    runtimeClass: gvisor

auth:
  sso:
    enabled: false  # Pro overlay: OAuth2 Proxy
  jwtSecret: ""
  # Unsigned identity. Must stay false in production. Enable only from a local overlay.
  devTokens:
    enabled: false
    prefix: ""
  trustTenantHeader: false

gateway:
  enabled: true
  gatewayClassName: "eg"
  envoyProxy:
    enabled: false
    hostNetwork: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  annotations: {}
  hosts:
    langfuse: ""
    aiGateway: ""
    aegra: ""
    mcp: ""
    nemo: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16.15-alpine"
  auth:
    username: zelkor
    password: ""
    postgresPassword: ""
    database: zelkor
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2.14-alpine"
  auth:
    password: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.12-alpine"
  auth:
    username: clickhouse
    password: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.19.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /readyz
      port: 6333
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: 6333
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

aiGateway:
  enabled: true
  # Consumer key for in-cluster callers (MCP, agents). Upstream provider keys stay in gateway secrets.
  consumerKey: ""
  providers:
    openai:
      apiKey: ""
      models:
        - "*"
    anthropic:
      apiKey: ""
      models:
        - "*"
    gemini:
      apiKey: ""
      models:
        - "*"
    ollamaLocal:
      host: ""
      models:
        - "*"
    ollamaCloud:
      apiKey: ""
      models:
        - "*"
    azure:
      apiKey: ""
      endpoint: ""
      models:
        - "*"
    bedrock:
      region: "us-east-1"
      accessKeyId: ""
      secretAccessKey: ""
      models:
        - "*"
    vllm:
      backendUrl: ""
      models:
        - "*"

langfuse:
  enabled: true
  replicaCount: 1
  image:
    repository: langfuse/langfuse
    tag: "4.21.0"
  worker:
    enabled: true
    replicaCount: 1
    image:
      repository: langfuse/langfuse-worker
      tag: "4.21.0"
  s3:
    bucket: langfuse
    region: auto
  migration:
    v4WriteMode: legacy
    enableHistoricBackfill: false
    nativeOtelBehaviour: dual_write
  nextauthUrl: ""
  nextauthSecret: ""
  salt: ""
  encryptionKey: ""
  init:
    enabled: false
    orgId: ""
    orgName: ""
    projectId: ""
    projectName: ""
    projectPublicKey: ""
    projectSecretKey: ""
    userEmail: ""
    userName: ""
    userPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  startupProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 45
  livenessProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

aegra:
  enabled: true
  replicaCount: 1
  tenantOrgMappings: {}
  image:
    repository: ghcr.io/devopssquaddev/zelkor-aegra
    tag: "dev"
    digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 18
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

guardrails:
  nemo:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/devopssquaddev/zelkor-guardrails
      tag: "dev"
      digest: ""
    offTopicRefusal: "This assistant cannot help with that request. Please stay on topic for your configured domain."
    complianceRefusal: "Request violated compliance, tenant privacy, and security policies."
    offTopicPatterns: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  # Enterprise only:
  # llamaGuard:
  #   enabled: false

mcp:
  enabled: true
  image:
    repository: ghcr.io/devopssquaddev/zelkor-mcp
    tag: "dev"
    digest: ""
  gateway:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  mcproute:
    enabled: false
  postgresMCP:
    enabled: true
    replicaCount: 1
    databaseUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  qdrantMCP:
    enabled: true
    replicaCount: 1
    url: ""
    collection: "documents"
    aiGatewayUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  sandboxMCP:
    enabled: true
    runtimeClassName: gvisor
    environments:
      - python-base
    warmPool:
      replicas: 3
    strictIsolation: false
    workerImage:
      repository: ghcr.io/devopssquaddev/zelkor-sandbox-worker
      tag: "dev"
      digest: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /health
          port: 8081
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: /health
          port: 8081
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 8081
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
  egress:
    externalBackends: []

seaweedfs:
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: "3.85"
  auth:
    accessKey: ""
    secretKey: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    tcpSocket:
      port: 8333
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: 8333
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
