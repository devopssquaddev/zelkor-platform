# Zelkor Community Edition — production chart defaults.
# Local kind: ./install.sh applies profiles/values-local.yaml (outside this chart).
# Demo overlays: examples/<name>/chart/values-platform-overlay.yaml when INSTALL_EXAMPLES=true.
#
# This file ships no passwords, API keys, localhost hosts, or Docker Desktop endpoints.
# Set secrets and hostnames in a customer overlay or existing Secret.
#
# First-party images (Aegra, MCP, guardrails, sandbox worker) are published to
# GHCR as ghcr.io/devopssquaddev/zelkor-*:dev until CI tags semver. Override
# repository, tag, or digest per environment. Pin digest in production.

global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  initContainerImage: busybox:1.37

# Process logs (stdout). DEBUG is overlay-only — see profiles/values-local.yaml.
logging:
  level: INFO
  format: json

databases:
  mode: in-cluster-basic  # in-cluster-basic (Gate A) | operators (Gate B)

highAvailability:
  enabled: false  # Gate B production toggle

security:
  mTLS:
    enabled: false
  sandbox:
    enabled: true
    runtimeClass: gvisor
  # Path A local overlay sets true. Production CE stays false until Path B.
  networkPolicies:
    enabled: false

auth:
  sso:
    enabled: false  # Pro overlay: OAuth2 Proxy
  jwtSecret: ""
  # Unsigned identity. Must stay false in production. Enable only from a local overlay.
  devTokens:
    enabled: false
    prefix: ""
  trustTenantHeader: false

gateway:
  enabled: true
  gatewayClassName: "eg"
  envoyProxy:
    enabled: false
    hostNetwork: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  annotations: {}
  hosts:
    langfuse: ""
    aiGateway: ""
    aegra: ""
    mcp: ""
    nemo: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16.15-alpine"
  auth:
    username: zelkor
    password: ""
    postgresPassword: ""
    database: zelkor
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2.14-alpine"
  auth:
    password: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.7.5-alpine"
  auth:
    username: clickhouse
    password: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.19.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /readyz
      port: 6333
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: 6333
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

aiGateway:
  enabled: true
  # Consumer key for in-cluster callers (MCP, agents). Upstream provider keys stay in gateway secrets.
  consumerKey: ""
  # In-cluster OpenAI-compatible base URL (…/v1). install.sh sets this from the
  # live Envoy Service (name includes a hash). Do not guess envoy-default-*-gateway.
  internalUrl: ""
  # ClusterIP/ExternalName service for in-cluster /v1 without Host: *.localhost
  inClusterService:
    enabled: true
    port: 80
    targetHost: ""
  providers:
    openai:
      apiKey: ""
      models:
        - "*"
    anthropic:
      apiKey: ""
      models:
        - "*"
    gemini:
      apiKey: ""
      models:
        - "*"
    ollamaLocal:
      host: ""
      models:
        - "*"
    ollamaCloud:
      apiKey: ""
      models:
        - "*"
    azure:
      apiKey: ""
      endpoint: ""
      models:
        - "*"
    bedrock:
      region: "us-east-1"
      accessKeyId: ""
      secretAccessKey: ""
      models:
        - "*"
    vllm:
      backendUrl: ""
      models:
        - "*"

langfuse:
  enabled: true
  replicaCount: 1
  image:
    repository: langfuse/langfuse
    tag: "4.24.0"
  worker:
    enabled: true
    replicaCount: 1
    image:
      repository: langfuse/langfuse-worker
      tag: "4.24.0"
  s3:
    bucket: langfuse
    region: auto
  migration:
    v4WriteMode: events_only
    enableHistoricBackfill: false
    nativeOtelBehaviour: direct
    allowPreviewOptIn: true
  surfaces:
    llmConnection:
      enabled: false
      name: zelkor-ai-gateway
      models: []
    tools:
      seedFromMcp: false
      seedTenant: "seed"
      authToken: ""
    evaluators:
      seedCode: false
    image:
      repository: ghcr.io/devopssquaddev/zelkor-langfuse-seed
      tag: "dev"
      digest: ""
  # Additional Langfuse projects + API keys (empty in the chart). Overlay, not init.projectId.
  extraProjects: []
  nextauthUrl: ""
  nextauthSecret: ""
  salt: ""
  encryptionKey: ""
  init:
    enabled: false
    orgId: ""
    orgName: ""
    projectId: ""
    projectName: ""
    projectPublicKey: ""
    projectSecretKey: ""
    userEmail: ""
    userName: ""
    userPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  startupProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 45
  livenessProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/public/health
      port: 3000
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

aegra:
  enabled: true
  replicaCount: 1
  tenantOrgMappings: {}
  # Empty-graph default stays off so this pod does not BLPOP the job list.
  # Executing / HA installs set redisBroker.enabled and get a prefix pair.
  redisBroker:
    enabled: false
  redis:
    channelPrefix: ""
    queueKey: ""
  runMigrationsOnStartup: false
  workerCount: 3
  nJobsPerWorker: 10
  workerDrainTimeout: 30
  terminationGracePeriodSeconds: 35
  # Comma-separated Aegra OTEL_TARGETS (LANGFUSE, PHOENIX, GENERIC). Empty = off.
  otelTargets: ""
  # Local/eval only: merge graph ids into front-door aegra.json.
  # Production: one ClusterIP Deployment per agent; Envoy routes by
  # X-Graph-ID / ?graph_id=. Per-agent vanity HTTPRoute is opt-in.
  # See internal/plan/requirements_drop_in_agent_contract.md §4.4. Default: none.
  graphs: {}
  graphModules:
    enabled: false
    configMapName: ""
    mountPath: /app/graphs
  # Extra Agent Protocol backends on gateway.hosts.aegra (overlay).
  # Each entry: { graphId, service, port } — in-cluster Service, not an http:// URL.
  # Empty = topology 1 (catch-all / → this Service). No fixture graphId.
  workers: []
  # Catch-all `/` on gateway.hosts.aegra → this Service. First zelkor-agent
  # asDefault worker sets this false (do not use `| default true` in templates).
  attachDefaultRoute: true
  # Mode B inject belongs on worker pods (charts/zelkor-agent), not the empty-graph front door.
  mcpInject:
    enabled: false
  image:
    repository: ghcr.io/devopssquaddev/zelkor-aegra
    tag: "dev"
    digest: ""
  cli:
    image:
      repository: ghcr.io/devopssquaddev/zelkor-aegra-cli
      tag: "dev"
      digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 18
  livenessProbe:
    httpGet:
      path: /live
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

guardrails:
  nemo:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/devopssquaddev/zelkor-guardrails
      tag: "dev"
      digest: ""
    configsDir: /etc/nemoguardrails/configs
    defaultConfigId: content_safety
    model: ""
    intercept:
      enabled: true
    aiGatewayRoute:
      enabled: false
    observability:
      otel:
        enabled: false  # when true: config.yml tracing adapter + opentelemetry-instrument (no sitecustomize)
        captureContent: false  # PII; LLMRails tracing.enable_content_capture (Langfuse observation I/O)
    safetyRefusal: "I can't help with that request."
    extraInputFlows: []
    extraColang: ""
    extraRailsConfig: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    startupProbe:
      httpGet:
        path: /v1/health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24
    livenessProbe:
      httpGet:
        path: /v1/health
        port: 8000
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /v1/health
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
  # Enterprise only:
  # llamaGuard:
  #   enabled: false

