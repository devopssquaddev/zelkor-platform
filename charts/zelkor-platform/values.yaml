workload:
  agents:
    enabled: true
    replicaCount: 1
    redisBroker:
      enabled: false
    redis:
      channelPrefix: ''
      queueKey: ''
    runMigrationsOnStartup: false
    workerCount: 3
    nJobsPerWorker: 10
    workerDrainTimeout: 30
    terminationGracePeriodSeconds: 35
    graphs: {}
    graphModules:
      enabled: false
      configMapName: ''
      mountPath: "/app/graphs"
    workers: []
    attachDefaultRoute: true
    mcpInject:
      enabled: false
    image:
      repository: ghcr.io/devopssquaddev/zelkor-aegra
      tag: 2.0.0
      digest: ''
    cli:
      image:
        repository: ghcr.io/devopssquaddev/zelkor-aegra-cli
        tag: 2.0.0
        digest: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    startupProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 18
    livenessProbe:
      httpGet:
        path: "/live"
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: "/ready"
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  intent:
    timeout: ''
    maxTokens: 0
    approval:
      enabled: false
      threshold: ''
highAvailability:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70
observability:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
databases:
  mode: in-cluster-basic
  postgresql:
    instances: 1
    storage:
      size: 10Gi
      storageClass: ''
    imageName: ghcr.io/cloudnative-pg/postgresql:16.15
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
      pluginName: barman-cloud.cloudnative-pg.io
    external:
      host: ''
      port: 5432
      username: ''
      password: ''
  clickhouse:
    clientNetworks: []
    ha: false
    storage:
      size: 20Gi
      storageClass: ''
    external:
      host: ''
      httpPort: 8123
      nativePort: 9000
      username: ''
      password: ''
  valkey:
    external:
      host: ''
      port: 6379
security:
  sandbox:
    enabled: true
    runtimeClass: gvisor
    failClosed: false
    createRuntimeClass: true
    overhead: {}
    nodes:
      selector: {}
      tolerations: []
    provisioning:
      mode: auto
      gvisorRelease: '20260817'
      baseUrl: ''
      verifyChecksum: false
      installer:
        image:
          repository: alpine
          tag: '3.22'
          digest: ''
        containerd:
          dropInDir: ''
          configPaths: []
          restartUnits: []
      verify:
        enabled: true
    executionLog:
      enabled: true
      includeStdoutPreview: false
      suspiciousOnProbePlusError: true
  networkPolicies:
    enabled: false
  mTLS:
    enabled: false
gateway:
  enabled: true
  gatewayClassName: eg
  createGatewayClass: true
  createGateway: true
  parentRef:
    name: ''
    namespace: ''
    sectionName: ''
  envoyProxy:
    enabled: false
    hostNetwork: false
    nodeSelector: {}
    service:
      type: ''
      name: ''
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  annotations: {}
  tls:
    enabled: false
    port: 443
    clusterIssuer: ''
    certificateRefs: []
  hosts:
    langfuse: ''
    aiGateway: ''
    aegra: ''
    agents: ''
    mcp: ''
    nemo: ''
  # Pro/team namespaces allowed to attach HTTPRoutes to this Gateway (ReferenceGrant).
  allowedRouteNamespaces: []
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16.15-alpine
  auth:
    username: zelkor
    password: ''
    postgresPassword: ''
    database: zelkor
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    exec:
      command:
      - pg_isready
      - "-U"
      - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    exec:
      command:
      - pg_isready
      - "-U"
      - "{{ .Values.postgresql.auth.username }}"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
