# Zelkor Community Edition — production defaults for values.yaml
# Local dev (kind): use values-local.yaml (in-chart DBs, HA off, FinServe demo).
#
# Target production toggles (Phase 1 Helm implementation):
#   highAvailability.enabled: true       # stateless apps + HPA
#   ingress.tls.enabled: true            # cert-manager
#   backups.enabled: true                # CNPG Barman Cloud Plugin → object store
#   databases.mode: operators
#   databases.postgresql.instances: 3    # CNPG HA
#   databases.clickhouse.ha: false       # Pro overlay: true
#   databases.valkey.ha: false           # Pro overlay: true
#
# Pro / Enterprise overlays: zelkor-platform-enterprise (SSO, GitOps, compliance).

global:
  tier: oss

highAvailability:
  enabled: false  # flip to true when Phase 1 HA templates land

security:
  mTLS:
    enabled: false
  sandbox:
    runtimeClass: gvisor

auth:
  sso:
    enabled: false  # Pro overlay: OAuth2 Proxy

aegra:
  enabled: true

litellm:
  enabled: true

langfuse:
  enabled: true

qdrant:
  enabled: true

postgresql:
  enabled: true

valkey:
  enabled: true

clickhouse:
  enabled: true
