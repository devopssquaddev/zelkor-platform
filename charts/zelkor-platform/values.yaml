# Zelkor Community Edition — production defaults for values.yaml
# Local dev (kind): use values-local.yaml (in-chart DBs, HA off, FinServe demo).
#
# Production defaults:
#   databases.mode: operators           # Gate B: CNPG HA Postgres, Barman, ClickHouse/Valkey operators
#   databases.postgresql.instances: 3   # CNPG HA
#   highAvailability.enabled: true      # stateless apps + HPA
#   ingress.tls.enabled: true           # cert-manager
#   backups.enabled: true               # CNPG Barman Cloud Plugin → object store

global:
  tier: oss
  imagePullPolicy: IfNotPresent

databases:
  mode: in-cluster-basic  # in-cluster-basic (Gate A) | operators (Gate B)

highAvailability:
  enabled: false  # Gate B production toggle

security:
  mTLS:
    enabled: false
  sandbox:
    enabled: true
    runtimeClass: gvisor

auth:
  sso:
    enabled: false  # Pro overlay: OAuth2 Proxy

gateway:
  enabled: true
  gatewayClassName: "eg"
  envoyProxy:
    enabled: false
    hostNetwork: false
  annotations: {}
  hosts:
    langfuse: "langfuse.localhost"
    aiGateway: "ai-gateway.localhost"
    aegra: "aegra.localhost"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: zelkor
    password: zelkor-dev-password
    postgresPassword: zelkor-postgres-pass
    database: zelkor
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2.5-alpine"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.3-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.9.2"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

aiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: python
    tag: "3.11-slim"
  langfuse:
    enabled: true
    publicKey: "pk-lf-zelkor-dev-00000000000000000000"
    secretKey: "sk-lf-zelkor-dev-00000000000000000000"
    host: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  providers:
    openai:
      apiKey: ""
      models:
        - "*"
    anthropic:
      apiKey: ""
      models:
        - "*"
    gemini:
      apiKey: ""
      models:
        - "*"
    ollama:
      apiKey: ""
      host: "http://host.docker.internal:11434"
      models:
        - "*"
    azure:
      apiKey: ""
      endpoint: ""
      models:
        - "*"
    bedrock:
      region: "us-east-1"
      accessKeyId: ""
      secretAccessKey: ""
      models:
        - "*"
    vllm:
      backendUrl: ""
      models:
        - "*"

langfuse:
  enabled: true
  replicaCount: 1
  image:
    repository: langfuse/langfuse
    tag: "2"
  nextauthUrl: ""
  nextauthSecret: "zelkor-langfuse-nextauth-secret-12345"
  salt: "zelkor-langfuse-salt-123456789"
  encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  init:
    enabled: false
    orgId: "zelkor-dev"
    orgName: "Zelkor Dev"
    projectId: "finserve"
    projectName: "FinServe AI"
    projectPublicKey: "pk-lf-zelkor-dev-00000000000000000000"
    projectSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
    userEmail: "admin@zelkor.local"
    userName: "Zelkor Admin"
    userPassword: "zelkor-dev-password"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

aegra:
  enabled: true
  replicaCount: 1
  image:
    repository: python
    tag: "3.11-slim"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

guardrails:
  nemo:
    enabled: true
    replicaCount: 1
    image:
      repository: python
      tag: "3.11-slim"
  # Enterprise only:
  # llamaGuard:
  #   enabled: false

