        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  qdrantMCP:
    enabled: true
    replicaCount: 1
    url: ""
    collection: "documents"
    aiGatewayUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  egressMCP:
    enabled: true
    replicaCount: 1
    allowedModels: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
