    extraBackends: []
    image:
      repository: ghcr.io/devopssquaddev/zelkor-mcp
      tag: 2.0.0
      digest: ''
    gateway:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      startupProbe:
        httpGet:
          path: "/health"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
    mcproute:
      enabled: false
    postgresMCP:
      enabled: true
      replicaCount: 1
      databaseUrl: ''
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      startupProbe:
        httpGet:
          path: "/health"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
    qdrantMCP:
      enabled: true
      replicaCount: 1
      url: ''
      collection: documents
      aiGatewayUrl: ''
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      startupProbe:
        httpGet:
          path: "/health"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
    aigatewayMCP:
      enabled: true
      replicaCount: 1
      allowedModels: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      startupProbe:
        httpGet:
          path: "/health"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
    sandboxMCP:
      enabled: true
      replicaCount: 1
      runtimeClassName: gvisor
      environments:
      - python-base
      warmPool:
        replicas: 3
      workerToken: ''
      strictIsolation: false
      workerImage:
        repository: ghcr.io/devopssquaddev/zelkor-sandbox-worker
        tag: 2.0.0
        digest: ''
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      startupProbe:
        httpGet:
          path: "/health"
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/health"
          port: 8080
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      worker:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: "/health"
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: "/health"
            port: 8081
