      defaultConfigId: content_safety
      model: ''
      intercept:
        enabled: true
      aiGatewayRoute:
        enabled: false
      observability:
        otel:
          enabled: false
          captureContent: false
      safetyRefusal: I can't help with that request.
      complianceRefusal: ''
      selfCheck:
        enabled: true
        model: ''
      extraInputFlows: []
      extraColang: ''
      extraRailsConfig: {}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      startupProbe:
        httpGet:
          path: "/v1/health"
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 24
      livenessProbe:
        httpGet:
          path: "/v1/health"
          port: 8000
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: "/v1/health"
          port: 8000
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
