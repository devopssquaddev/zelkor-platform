# Local development overrides (kind)
# Used by ./install.sh — sensible defaults for TTFV < 5 minutes

global:
  tier: oss
  imagePullPolicy: IfNotPresent

databases:
  mode: in-cluster-basic

highAvailability:
  enabled: false

security:
  mTLS:
    enabled: false
  sandbox:
    enabled: true
    runtimeClass: gvisor

auth:
  sso:
    enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    langfuse: "langfuse.localhost"
    litellm: "litellm.localhost"
    aegra: "aegra.localhost"

postgresql:
  enabled: true

valkey:
  enabled: true

clickhouse:
  enabled: true

qdrant:
  enabled: true

litellm:
  enabled: true
  replicaCount: 1

langfuse:
  enabled: true
  replicaCount: 1

aegra:
  enabled: true
  replicaCount: 1
