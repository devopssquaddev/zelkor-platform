# Local development overrides (kind)
# Used by ./install.sh — sensible defaults for TTFV < 5 minutes

global:
  tier: oss
  imagePullPolicy: IfNotPresent

databases:
  mode: in-cluster-basic

highAvailability:
  enabled: false

security:
  mTLS:
    enabled: false
  sandbox:
    enabled: true
    runtimeClass: gvisor

auth:
  sso:
    enabled: false

gateway:
  enabled: true
  gatewayClassName: "eg"
  envoyProxy:
    enabled: true
    hostNetwork: true
  hosts:
    langfuse: "langfuse.localhost"
    aiGateway: "ai-gateway.localhost"
    aegra: "aegra.localhost"
    mcp: "mcp.localhost"

postgresql:
  enabled: true

valkey:
  enabled: true

clickhouse:
  enabled: true

qdrant:
  enabled: true

aiGateway:
  enabled: true
  replicaCount: 1
  langfuse:
    enabled: true
    publicKey: "pk-lf-zelkor-dev-00000000000000000000"
    secretKey: "sk-lf-zelkor-dev-00000000000000000000"

langfuse:
  enabled: true
  replicaCount: 1
  nextauthUrl: "http://langfuse.localhost:8088"
  init:
    enabled: true
    orgId: "zelkor-dev"
    orgName: "Zelkor Dev"
    projectId: "finserve"
    projectName: "FinServe AI"
    projectPublicKey: "pk-lf-zelkor-dev-00000000000000000000"
    projectSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
    userEmail: "admin@zelkor.local"
    userName: "Zelkor Admin"
    userPassword: "zelkor-dev-password"

aegra:
  enabled: true
  replicaCount: 1

guardrails:
  nemo:
    enabled: true

mcp:
  enabled: true
  sandboxMCP:
    warmPool:
      replicas: 2

