{{- if and .Values.clickhouse.enabled (eq .Values.databases.mode "in-cluster-basic") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-clickhouse
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-clickhouse-log
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  zelkor-log.xml: |
    <clickhouse>
      <logger>
        <level>{{ include "zelkor-platform.vendorLogLevel" (dict "root" . "component" .Values.clickhouse "vendor" "clickhouse") }}</level>
        <console>1</console>
      </logger>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-clickhouse
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "zelkor-platform.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository | default "clickhouse/clickhouse-server" }}:{{ .Values.clickhouse.image.tag | default "26.7.5-alpine" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.auth.username | default "clickhouse" | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-clickhouse
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: zelkor-log
              mountPath: /etc/clickhouse-server/config.d/zelkor-log.xml
              subPath: zelkor-log.xml
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.clickhouse) | nindent 10 }}
      volumes:
        - name: zelkor-log
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-clickhouse-log
{{- end }}
