{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-litellm-config
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
data:
  config.yaml: |
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: {{ .Values.litellm.openaiApiKey | default "sk-mock-dev-key" | quote }}
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: {{ .Values.litellm.openaiApiKey | default "sk-mock-dev-key" | quote }}
      - model_name: mock-model
        litellm_params:
          model: openai/mock-model
          api_key: "sk-mock-dev-key"
    litellm_settings:
      drop_params: true
      set_verbose: false
    general_settings:
      master_key: {{ .Values.litellm.masterKey | default "sk-zelkor-master-key" | quote }}
      database_url: "postgresql://{{ .Values.postgresql.auth.username | default "zelkor" }}:{{ .Values.postgresql.auth.password | default "zelkor-dev-password" }}@{{ include "zelkor-platform.fullname" . }}-postgresql:5432/litellm"
{{- end }}
