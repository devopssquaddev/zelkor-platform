{{- include "zelkor-platform.compile" . -}}
{{- $hostnames := include "zelkor-platform.aiGatewayHostnames" . | fromJsonArray -}}
{{- $hasProviders := eq (include "zelkor-platform.aiGatewayHasProviders" .) "true" -}}
{{- $intercept := eq (include "zelkor-platform.nemoInterceptEnabled" .) "true" -}}
{{- $rl := (.Values.aiGateway.rateLimit | default dict) -}}
{{- $enabled := $rl.enabled | default false -}}
{{- $rpm := $rl.requestsPerMinute | int -}}
{{- if and $enabled .Values.aiGateway.enabled (gt (len $hostnames) 0) $hasProviders }}
{{- if lt $rpm 1 -}}
{{- fail "workspace.models.rateLimit.requestsPerMinute must be >= 1 when rateLimit.enabled is true" -}}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aigateway-ratelimit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "workspace.models.rateLimit") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "zelkor-platform.fullname" . }}-aigateway-route
  mergeType: StrategicMerge
  rateLimit:
    type: Global
    global:
      rules:
        {{- /* BUG-02: shared = one install-wide bucket across every aigateway-route rule
             (Envoy Gateway otherwise keeps one counter per rule). With NeMo intercept, only
             the NeMo -> provider hop (bypass header) counts; agent -> NeMo is uncounted, so
             one /v1 call spends the cap once per upstream request. NeMo returns the 429. */}}
        - shared: true
          {{- if $intercept }}
          clientSelectors:
            - headers:
                - name: x-zelkor-guardrails-bypass
                  type: Exact
                  value: "1"
          {{- end }}
          limit:
            requests: {{ $rpm }}
            unit: Minute
{{- end }}
