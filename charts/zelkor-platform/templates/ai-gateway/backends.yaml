# OpenAI-compatible extra hosts
{{- range .Values.aiGateway.providers.openaiCompat | default list }}
{{- if and .name .host .modelMatch }}
{{- $port := .port | default 443 | int }}
{{- $tls := .tls | default true }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ include "zelkor-platform.fullname" $ }}-backend-compat-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  schema:
    name: OpenAI
    {{- if .prefix }}
    prefix: {{ .prefix | quote }}
    {{- end }}
  backendRef:
    name: {{ include "zelkor-platform.fullname" $ }}-backend-compat-{{ .name }}
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ include "zelkor-platform.fullname" $ }}-backend-compat-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: {{ .host | quote }}
        port: {{ $port }}
---
{{- if $tls }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" $ }}-backend-compat-{{ .name }}-tls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: {{ include "zelkor-platform.fullname" $ }}-backend-compat-{{ .name }}
  validation:
    wellKnownCACertificates: System
    hostname: {{ .host | quote }}
---
{{- end }}
{{- end }}
{{- end }}

