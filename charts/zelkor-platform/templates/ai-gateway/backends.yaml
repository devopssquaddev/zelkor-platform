{{- if .Values.aiGateway.enabled }}

# Ollama Local — host Ollama / vLLM-compatible server (no upstream API key)
{{- if .Values.aiGateway.providers.ollamaLocal.host }}
{{- $parsed := urlParse .Values.aiGateway.providers.ollamaLocal.host }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-local
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: {{ $parsed.hostname | required "aiGateway.providers.ollamaLocal.host must include a hostname" }}
        port: {{ $parsed.port | default 11434 | int }}
---
{{- end }}

# Ollama Cloud — ollama.com hosted models (requires apiKey)
{{- if .Values.aiGateway.providers.ollamaCloud.apiKey }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: ollama.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
  validation:
    wellKnownCACertificates: System
    hostname: ollama.com
---
{{- end }}

