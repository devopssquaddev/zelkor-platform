# vLLM Backend
{{- if .Values.aiGateway.providers.vllm.backendUrl }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-vllm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: {{ include "zelkor-platform.fullname" . }}-backend-vllm
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-vllm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: {{ (urlParse .Values.aiGateway.providers.vllm.backendUrl).hostname | default "vllm.ai-cluster.svc" }}
        port: {{ (urlParse .Values.aiGateway.providers.vllm.backendUrl).port | default 8000 | int }}
---
{{- end }}

# NeMo Guardrails Backend (default /v1 intercept or legacy nemo/* prefix)
{{- if eq (include "zelkor-platform.nemoAiGatewayBackendEnabled" .) "true" }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-backend-nemo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: {{ include "zelkor-platform.fullname" . }}-backend-nemo
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
