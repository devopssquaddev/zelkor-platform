{{- if .Values.aiGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ai-gateway-config
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
data:
  gateway.yaml: |
    version: v1
    providers:
      {{- toYaml .Values.aiGateway.providers | nindent 6 }}
    routes:
      {{- toYaml .Values.aiGateway.routes | nindent 6 }}
  gateway.py: |
    import os
    import time
    import uuid
    import datetime
    import logging
    from fastapi import FastAPI, Request, Response, HTTPException, Header, BackgroundTasks
    from fastapi.responses import JSONResponse
    import uvicorn
    import httpx

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger("envoy-ai-gateway")

    LANGFUSE_HOST = os.getenv("LANGFUSE_HOST", "http://zelkor-platform-langfuse:3000")
    LANGFUSE_PUBLIC_KEY = os.getenv("LANGFUSE_PUBLIC_KEY", "pk-lf-zelkor-dev-00000000000000000000")
    LANGFUSE_SECRET_KEY = os.getenv("LANGFUSE_SECRET_KEY", "sk-lf-zelkor-dev-00000000000000000000")

    app = FastAPI(title="Envoy AI Gateway", version="0.1.0")

    async def emit_langfuse_trace(tenant_id: str, provider: str, model: str, messages: list, completion_text: str, prompt_tokens: int, completion_tokens: int, start_time: float, duration_ms: float):
        if not LANGFUSE_PUBLIC_KEY or not LANGFUSE_SECRET_KEY:
            return
        try:
            now = datetime.datetime.now(datetime.timezone.utc)
            start_iso = datetime.datetime.fromtimestamp(start_time, tz=datetime.timezone.utc).isoformat()
            end_iso = now.isoformat()
            trace_id = f"trace-{uuid.uuid4().hex}"
            gen_id = f"gen-{uuid.uuid4().hex}"

            payload = {
                "batch": [
                    {
                        "id": str(uuid.uuid4()),
                        "type": "trace-create",
                        "timestamp": end_iso,
                        "body": {
                            "id": trace_id,
                            "name": f"ai-gateway:{provider}",
                            "userId": tenant_id,
                            "tags": ["envoy-ai-gateway", provider, tenant_id],
                            "input": messages,
                            "output": completion_text,
                            "metadata": {
                                "provider": provider,
                                "model": model,
                                "latency_ms": round(duration_ms, 2)
                            }
                        }
                    },
                    {
                        "id": str(uuid.uuid4()),
                        "type": "generation-create",
                        "timestamp": end_iso,
                        "body": {
                            "id": gen_id,
                            "traceId": trace_id,
                            "name": "chat_completion",
                            "model": model,
                            "startTime": start_iso,
                            "endTime": end_iso,
                            "input": messages,
                            "output": {"role": "assistant", "content": completion_text},
                            "usage": {
                                "promptTokens": prompt_tokens,
                                "completionTokens": completion_tokens,
                                "totalTokens": prompt_tokens + completion_tokens
                            },
                            "metadata": {
                                "tenant_id": tenant_id,
                                "provider": provider
                            }
                        }
                    }
                ]
            }
            async with httpx.AsyncClient(timeout=2.0) as client:
                await client.post(
                    f"{LANGFUSE_HOST}/api/public/ingestion",
                    auth=(LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY),
                    json=payload
                )
        except Exception as e:
            logger.debug(f"Langfuse trace emission skipped: {e}")

    @app.get("/healthz")
    async def healthz():
        return {"status": "healthy", "service": "envoy-ai-gateway"}

    @app.get("/ready")
    async def ready():
        return {"status": "ready", "service": "envoy-ai-gateway"}

    @app.get("/v1/models")
    async def list_models():
        return {
            "object": "list",
            "data": [
                {"id": "gpt-4o", "object": "model", "owned_by": "openai"},
                {"id": "gpt-4o-mini", "object": "model", "owned_by": "openai"},
                {"id": "openai/gpt-4o-mini", "object": "model", "owned_by": "openai"},
                {"id": "openai/gpt-4o", "object": "model", "owned_by": "openai"},
                {"id": "anthropic/claude-3-5-sonnet", "object": "model", "owned_by": "anthropic"},
                {"id": "gemini/gemini-1.5-flash", "object": "model", "owned_by": "google"},
                {"id": "ollama/llama3.2", "object": "model", "owned_by": "ollama"},
                {"id": "vllm/llama3.2", "object": "model", "owned_by": "vllm"},
                {"id": "mock-model", "object": "model", "owned_by": "mock"},
                {"id": "*", "object": "model", "owned_by": "envoy-ai-gateway"}
            ]
        }

    @app.post("/v1/chat/completions")
    async def chat_completions(request: Request, authorization: str = Header(None), x_tenant_id: str = Header(None)):
        start_time = time.time()
        headers = dict(request.headers)
        tenant_id = x_tenant_id or headers.get("x-tenant-id") or headers.get("X-Tenant-ID") or "default"

        try:
            body = await request.json()
        except Exception:
            body = {}

        model = body.get("model", "gpt-4o-mini")
        messages = body.get("messages", [])

        # Determine upstream provider
        if "/" in model:
            provider, model_name = model.split("/", 1)
        else:
            provider = "openai"
            model_name = model

        # Calculate token metrics
        prompt_text = " ".join([m.get("content", "") for m in messages if isinstance(m.get("content"), str)])
        prompt_tokens = max(1, len(prompt_text.split()))
        completion_text = f"Hello from {provider.capitalize()} route via Envoy AI Gateway! (Model: {model}, Tenant: {tenant_id})"
        completion_tokens = len(completion_text.split())
        duration_ms = (time.time() - start_time) * 1000

        logger.info(
            f"GenAI Telemetry: tenant={tenant_id} provider={provider} model={model} "
            f"prompt_tokens={prompt_tokens} completion_tokens={completion_tokens} "
            f"latency={duration_ms:.2f}ms status=200"
        )

        await emit_langfuse_trace(
            tenant_id=tenant_id,
            provider=provider,
            model=model,
            messages=messages,
            completion_text=completion_text,
            prompt_tokens=prompt_tokens,
            completion_tokens=completion_tokens,
            start_time=start_time,
            duration_ms=duration_ms
        )

        return {
            "id": f"chatcmpl-{uuid.uuid4().hex[:12]}",
            "object": "chat.completion",
            "created": int(time.time()),
            "model": model,
            "choices": [
                {
                    "index": 0,
                    "message": {
                        "role": "assistant",
                        "content": completion_text
                    },
                    "finish_reason": "stop"
                }
            ],
            "usage": {
                "prompt_tokens": prompt_tokens,
                "completion_tokens": completion_tokens,
                "total_tokens": prompt_tokens + completion_tokens
            }
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
{{- end }}
