{{- if and .Values.aiGateway.enabled .Values.aiGateway.inClusterService.enabled }}
{{- $targetHost := include "zelkor-platform.envoyDataplaneHost" . | trim -}}
{{- if $targetHost }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ai-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  type: ExternalName
  externalName: {{ $targetHost }}
  ports:
    - name: http
      port: {{ .Values.aiGateway.inClusterService.port | default 80 }}
      protocol: TCP
{{- end }}
{{- end }}
