{{- if .Values.aiGateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ai-gateway-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.openai.apiKey | default .Values.aiGateway.providers.ollama.apiKey | default .Values.aiGateway.providers.anthropic.apiKey | default .Values.aiGateway.providers.gemini.apiKey | default "zelkor-dev-key" | quote }}
  {{- if .Values.aiGateway.providers.openai.apiKey }}
  openaiApiKey: {{ .Values.aiGateway.providers.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.aiGateway.providers.anthropic.apiKey }}
  anthropicApiKey: {{ .Values.aiGateway.providers.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.aiGateway.providers.ollama.apiKey }}
  ollamaApiKey: {{ .Values.aiGateway.providers.ollama.apiKey | quote }}
  {{- end }}
  {{- if .Values.aiGateway.providers.gemini.apiKey }}
  geminiApiKey: {{ .Values.aiGateway.providers.gemini.apiKey | quote }}
  {{- end }}
  {{- if .Values.aiGateway.providers.azure.apiKey }}
  azureApiKey: {{ .Values.aiGateway.providers.azure.apiKey | quote }}
  {{- end }}
{{- end }}
