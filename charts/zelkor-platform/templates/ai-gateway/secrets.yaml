{{- include "zelkor-platform.compile" . -}}
{{- if .Values.aiGateway.enabled }}
{{- if .Values.aiGateway.providers.openai.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-openai-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.openai.apiKey | quote }}
---
{{- end }}
{{- if .Values.aiGateway.providers.anthropic.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-anthropic-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.anthropic.apiKey | quote }}
---
{{- end }}
{{- if .Values.aiGateway.providers.ollamaCloud.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ollama-cloud-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.ollamaCloud.apiKey | quote }}
---
{{- end }}
{{- if .Values.aiGateway.providers.gemini.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gemini-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.gemini.apiKey | quote }}
---
{{- end }}
{{- if eq (include "zelkor-platform.aiGatewayAzureEnabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-azure-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.azure.apiKey | quote }}
---
{{- end }}
{{- if eq (include "zelkor-platform.aiGatewayBedrockEnabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-bedrock-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  credentials: |
    [default]
    aws_access_key_id = {{ .Values.aiGateway.providers.bedrock.accessKeyId }}
    aws_secret_access_key = {{ .Values.aiGateway.providers.bedrock.secretAccessKey }}
---
{{- end }}
{{- if and (eq (include "zelkor-platform.aiGatewayVertexEnabled" .) "true") .Values.aiGateway.providers.vertex.credentialsJson (not .Values.aiGateway.providers.vertex.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-vertex-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  service_account.json: {{ .Values.aiGateway.providers.vertex.credentialsJson | quote }}
---
{{- end }}
{{- if eq (include "zelkor-platform.aiGatewayCohereEnabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-cohere-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .Values.aiGateway.providers.cohere.apiKey | quote }}
---
{{- end }}
{{- range .Values.aiGateway.providers.openaiCompat | default list }}
{{- if and .name .host .modelMatch .apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" $ }}-compat-{{ .name }}-api-key
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
type: Opaque
stringData:
  apiKey: {{ .apiKey | quote }}
---
{{- end }}
{{- end }}
{{- end }}
