{{- if .Values.aiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ai-gateway
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  replicas: {{ .Values.aiGateway.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-gateway
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: "{{ .Values.aiGateway.image.repository | default "python" }}:{{ .Values.aiGateway.image.tag | default "3.11-slim" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir fastapi uvicorn httpx pydantic >/dev/null 2>&1
              python /app/gateway.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LANGFUSE_HOST
              value: {{ .Values.aiGateway.langfuse.host | default (printf "http://%s-langfuse:3000" (include "zelkor-platform.fullname" .)) | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.aiGateway.langfuse.publicKey | default "pk-lf-zelkor-dev-00000000000000000000" | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.aiGateway.langfuse.secretKey | default "sk-lf-zelkor-dev-00000000000000000000" | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/gateway.py
              subPath: gateway.py
            - name: config
              mountPath: /app/gateway.yaml
              subPath: gateway.yaml
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          resources:
            {{- toYaml .Values.aiGateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-ai-gateway-config
{{- end }}
