{{- if and .Values.aiGateway.enabled .Values.gateway.hosts.aiGateway (or .Values.aiGateway.providers.openai.apiKey .Values.aiGateway.providers.anthropic.apiKey .Values.aiGateway.providers.gemini.apiKey .Values.aiGateway.providers.vllm.backendUrl .Values.aiGateway.providers.ollamaCloud.apiKey .Values.aiGateway.providers.ollamaLocal.host) }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aigateway-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  parentRefs:
    - name: {{ include "zelkor-platform.fullname" . }}-gateway
      namespace: {{ .Release.Namespace }}
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - {{ .Values.gateway.hosts.aiGateway | quote }}
  rules:
    {{- if and .Values.guardrails.nemo.enabled .Values.guardrails.nemo.aiGatewayRoute.enabled }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(nemo/.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-nemo
    {{- end }}
    {{- if .Values.aiGateway.providers.openai.apiKey }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(openai/.*|gpt-.*|o1.*|o3.*|text-embedding.*|chatgpt-.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-openai
    {{- end }}
    {{- if .Values.aiGateway.providers.anthropic.apiKey }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(anthropic/.*|claude-.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-anthropic
    {{- end }}
    {{- if .Values.aiGateway.providers.gemini.apiKey }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(gemini/.*|gemini-.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-gemini
    {{- end }}
    {{- if .Values.aiGateway.providers.vllm.backendUrl }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(vllm/.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-vllm
    {{- end }}
    {{- if .Values.aiGateway.providers.ollamaCloud.apiKey }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(gpt-oss.*|deepseek-r1.*|qwen3.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
    {{- end }}
    {{- if .Values.aiGateway.providers.ollamaLocal.host }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(ollama/.*|llama.*|deepseek.*|qwen.*|mistral.*|phi.*|codellama.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-local
    {{- end }}
    {{- if or .Values.aiGateway.providers.openai.apiKey .Values.aiGateway.providers.ollamaCloud.apiKey .Values.aiGateway.providers.ollamaLocal.host .Values.aiGateway.providers.anthropic.apiKey .Values.aiGateway.providers.gemini.apiKey .Values.aiGateway.providers.vllm.backendUrl }}
    - backendRefs:
        {{- if .Values.aiGateway.providers.openai.apiKey }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-openai
        {{- else if .Values.aiGateway.providers.ollamaCloud.apiKey }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-cloud
        {{- else if .Values.aiGateway.providers.ollamaLocal.host }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-ollama-local
        {{- else if .Values.aiGateway.providers.anthropic.apiKey }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-anthropic
        {{- else if .Values.aiGateway.providers.gemini.apiKey }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-gemini
        {{- else if .Values.aiGateway.providers.vllm.backendUrl }}
        - name: {{ include "zelkor-platform.fullname" . }}-backend-vllm
        {{- end }}
    {{- end }}
{{- end }}
