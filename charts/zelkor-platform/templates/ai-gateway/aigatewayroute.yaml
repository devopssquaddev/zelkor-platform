{{- include "zelkor-platform.compile" . -}}
{{- $hostnames := include "zelkor-platform.aiGatewayHostnames" . | fromJsonArray -}}
{{- $hasProviders := eq (include "zelkor-platform.aiGatewayHasProviders" .) "true" -}}
{{- $intercept := eq (include "zelkor-platform.nemoInterceptEnabled" .) "true" -}}
{{- $legacyNemoPrefix := and .Values.guardrails.nemo.enabled .Values.guardrails.nemo.aiGatewayRoute.enabled -}}
{{- $matches := include "zelkor-platform.aiGatewayProviderMatches" . | fromJsonArray -}}
{{- if and .Values.aiGateway.enabled (gt (len $hostnames) 0) $hasProviders }}
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aigateway-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aiGateway") | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  parentRefs:
    {{- include "zelkor-platform.gatewayParentRef" . | nindent 4 }}
  hostnames:
    {{- range $hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- $exact := include "zelkor-platform.aiGatewayExactModelMatches" . | fromJsonArray -}}
    {{- if $intercept }}
    {{- /* NeMo upstream: bypass + model regex (two headers). The unknown-model HTTPRoute matches bypass alone so it stays less specific. Never add x-ai-eg-model ".+" on that route or here: equal header counts tie, and the older route wins across upgrades. */}}
    {{- range $matches }}
    - matches:
        - headers:
            - type: Exact
              name: x-zelkor-guardrails-bypass
              value: "1"
            - type: RegularExpression
              name: x-ai-eg-model
              value: {{ .match | quote }}
      backendRefs:
        - name: {{ .backend }}
    {{- end }}
    {{- /* Exact default ids → NeMo: populates /v1/models; intercept without bypass. */}}
    {{- range $exact }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .model | quote }}
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" $ }}-backend-nemo
    {{- end }}
    {{- /* Default intercept: all other /v1 chat traffic -> NeMo (fail-closed). */}}
    - backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-nemo
    {{- else }}
    {{- if $legacyNemoPrefix }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "^(nemo/.*)"
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-backend-nemo
    {{- end }}
    {{- range $exact }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .model | quote }}
      backendRefs:
        - name: {{ .backend }}
    {{- end }}
    {{- range $matches }}
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: {{ .match | quote }}
      backendRefs:
        - name: {{ .backend }}
    {{- end }}
    {{- if $hasProviders }}
    - backendRefs:
        - name: {{ include "zelkor-platform.aiGatewayDefaultBackend" . }}
    {{- end }}
    {{- end }}
{{- end }}
