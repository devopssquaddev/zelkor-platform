{{- if .Values.langfuse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-engine-sink
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine-sink
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: engine-sink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-engine-sink
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine-sink
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine-sink
    spec:
      containers:
        - name: engine-sink
          image: python:3.11-slim
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - /bin/bash
            - -c
            - |
              cat << 'EOF' > /tmp/sink_server.py
              import json
              import logging
              from http.server import HTTPServer, BaseHTTPRequestHandler

              logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')

              class SinkHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ['/health', '/ready']:
                          self.send_response(200)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(b'{"status":"ok","component":"engine-sink"}')
                      else:
                          self.send_response(404)
                          self.end_headers()

                  def do_POST(self):
                      content_length = int(self.headers.get('Content-Length', 0))
                      body = self.rfile.read(content_length)
                      try:
                          payload = json.loads(body.decode('utf-8'))
                          logging.info(f"[ENGINE-SINK] Received trace event: {payload.get('event', 'unknown')} | Project: {payload.get('projectId', 'finserve')}")
                      except Exception:
                          logging.info(f"[ENGINE-SINK] Received raw payload ({content_length} bytes)")

                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(b'{"status":"received"}')

              server = HTTPServer(('0.0.0.0', 8080), SinkHandler)
              logging.info("[ENGINE-SINK] Listening on port 8080...")
              server.serve_forever()
              EOF
              python3 /tmp/sink_server.py
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
