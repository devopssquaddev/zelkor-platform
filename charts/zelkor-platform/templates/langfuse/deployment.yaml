{{- include "zelkor-platform.compile" . -}}
{{- if .Values.langfuse.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-langfuse
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "langfuse") | nindent 4 }}
    app.kubernetes.io/component: langfuse
type: Opaque
stringData:
  nextauth-secret: {{ required "langfuse.nextauthSecret is required when langfuse.enabled" .Values.langfuse.nextauthSecret | quote }}
  salt: {{ required "langfuse.salt is required when langfuse.enabled" .Values.langfuse.salt | quote }}
  encryption-key: {{ required "langfuse.encryptionKey is required when langfuse.enabled" .Values.langfuse.encryptionKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-langfuse
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "langfuse") | nindent 4 }}
    app.kubernetes.io/component: langfuse
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse
    app.kubernetes.io/langfuse-role: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-langfuse
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "langfuse") | nindent 4 }}
    app.kubernetes.io/component: langfuse
    app.kubernetes.io/langfuse-role: web
spec:
  {{- if ne (include "zelkor-platform.haEnabled" .) "true" }}
  replicas: {{ .Values.langfuse.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: langfuse
      app.kubernetes.io/langfuse-role: web
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse
        app.kubernetes.io/langfuse-role: web
    spec:
      initContainers:
        - name: wait-for-deps
          image: {{ .Values.global.initContainerImage | default "busybox:1.37" }}
          command:
            - sh
            - -c
            - |
              {{ include "zelkor-platform.langfuseWaitScript" . | nindent 14 }}
      containers:
        - name: langfuse
          image: "{{ .Values.langfuse.image.repository }}:{{ .Values.langfuse.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 3000
              name: http
          env:
            {{ include "zelkor-platform.langfuseCoreEnv" . | nindent 12 }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-langfuse
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: {{ required "langfuse.nextauthUrl is required when langfuse.enabled" .Values.langfuse.nextauthUrl | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.langfuse) | nindent 10 }}
{{- if .Values.langfuse.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-langfuse-worker
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "langfuse") | nindent 4 }}
    app.kubernetes.io/component: langfuse
    app.kubernetes.io/langfuse-role: worker
spec:
  {{- if ne (include "zelkor-platform.haEnabled" .) "true" }}
  replicas: {{ .Values.langfuse.worker.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: langfuse
      app.kubernetes.io/langfuse-role: worker
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse
        app.kubernetes.io/langfuse-role: worker
    spec:
      initContainers:
        - name: wait-for-deps
          image: {{ .Values.global.initContainerImage | default "busybox:1.37" }}
          command:
            - sh
            - -c
            - |
              {{ include "zelkor-platform.langfuseWaitScript" . | nindent 14 }}
      containers:
        - name: langfuse-worker
          image: "{{ .Values.langfuse.worker.image.repository }}:{{ .Values.langfuse.worker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 3030
              name: http
          env:
            {{ include "zelkor-platform.langfuseCoreEnv" . | nindent 12 }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-langfuse
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: {{ required "langfuse.nextauthUrl is required when langfuse.enabled" .Values.langfuse.nextauthUrl | quote }}
          livenessProbe:
            tcpSocket:
              port: 3030
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3030
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.langfuse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
