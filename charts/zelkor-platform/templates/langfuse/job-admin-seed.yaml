{{- $admin := .Values.langfuse.admin | default dict -}}
{{- $surfaces := .Values.langfuse.surfaces | default dict -}}
{{- if and .Values.langfuse.enabled $admin.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-langfuse-admin
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-admin
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse-admin
    spec:
      restartPolicy: OnFailure
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: seed
          image: {{ include "zelkor-platform.image" $surfaces.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" $surfaces.image) }}
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" $surfaces "name" "zelkor-langfuse-seed") | nindent 12 }}
            - name: SEED_ADMIN
              value: "true"
            - name: LANGFUSE_HOST
              value: {{ printf "http://%s-langfuse:3000" (include "zelkor-platform.fullname" .) | quote }}
            - name: DATABASE_URL
              value: {{ include "zelkor-platform.postgresUrl" (list . "langfuse") | quote }}
            - name: LANGFUSE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.langfuseAdminSecretName" . }}
                  key: email
            - name: LANGFUSE_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.langfuseAdminSecretName" . }}
                  key: name
            - name: LANGFUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.langfuseAdminSecretName" . }}
                  key: password
{{- end }}
