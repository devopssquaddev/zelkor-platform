{{- $init := .Values.langfuse.init | default dict -}}
{{- if and .Values.langfuse.enabled $init.projectPublicKey $init.projectSecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.langfuseOtelSecretName" . }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-otel
type: Opaque
stringData:
  OTEL_TARGETS: LANGFUSE
  LANGFUSE_BASE_URL: {{ printf "http://%s-langfuse:3000" (include "zelkor-platform.fullname" .) | quote }}
  LANGFUSE_PUBLIC_KEY: {{ $init.projectPublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ $init.projectSecretKey | quote }}
{{- end }}
