{{- $admin := .Values.langfuse.admin | default dict -}}
{{- if and .Values.langfuse.enabled $admin.enabled (not $admin.existingSecret) }}
{{- $name := include "zelkor-platform.langfuseAdminSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $email := $admin.email | default "" -}}
{{- $password := $admin.password | default "" -}}
{{- $displayName := $admin.name | default "Admin" -}}
{{- if and $existing $existing.data }}
{{- if and (not $admin.email) (index $existing.data "email") -}}
{{- $email = index $existing.data "email" | b64dec -}}
{{- end -}}
{{- if and (not $admin.password) (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if and (not $admin.name) (index $existing.data "name") -}}
{{- $displayName = index $existing.data "name" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $email -}}
{{- $host := include "zelkor-platform.langfuseAdminEmailHost" . -}}
{{- if or (not $host) (eq $host "localhost") -}}
{{- fail "langfuse.admin.email or gateway.hosts.langfuse / langfuse.nextauthUrl is required when langfuse.admin.enabled" -}}
{{- end -}}
{{- $email = printf "admin@%s" $host -}}
{{- end -}}
{{- if not $password -}}
{{- $password = printf "%s!9" (randAlphaNum 28) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "langfuse") | nindent 4 }}
    app.kubernetes.io/component: langfuse-admin
type: Opaque
stringData:
  email: {{ $email | quote }}
  name: {{ $displayName | quote }}
  password: {{ $password | quote }}
{{- end }}
