{{- if and .Values.postgresql.enabled (eq .Values.databases.mode "in-cluster-basic") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-postgresql-init
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
    01-init-databases.sql: |
      CREATE DATABASE aegra;
      CREATE DATABASE langfuse;
      ALTER USER {{ .Values.postgresql.auth.username }} WITH PASSWORD '{{ include "zelkor-platform.postgresPassword" . }}';
      GRANT ALL PRIVILEGES ON DATABASE aegra TO {{ .Values.postgresql.auth.username }};
      GRANT ALL PRIVILEGES ON DATABASE langfuse TO {{ .Values.postgresql.auth.username }};
{{- end }}
