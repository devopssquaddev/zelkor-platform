{{- $mode := include "zelkor-platform.dbMode" . -}}
{{- if and .Values.postgresql.enabled (or (eq $mode "in-cluster-basic") (eq $mode "operator-cr")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-postgresql
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "postgresql") | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  postgres-password: {{ include "zelkor-platform.postgresPassword" . | quote }}
  password: {{ include "zelkor-platform.postgresPassword" . | quote }}
  username: {{ .Values.postgresql.auth.username | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
{{- end }}
