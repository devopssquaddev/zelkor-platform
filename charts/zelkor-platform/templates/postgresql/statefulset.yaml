{{- include "zelkor-platform.compile" . -}}
{{- if and .Values.postgresql.enabled (eq .Values.databases.mode "in-cluster-basic") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-postgresql
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "postgresql") | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
{{- /* An existing StatefulSet's claim templates are immutable: keep what it was created with. */ -}}
{{- $persist := .Values.postgresql.persistence | default dict -}}
{{- $pvc := ($persist.enabled | default false) -}}
{{- $live := lookup "apps/v1" "StatefulSet" .Release.Namespace (printf "%s-postgresql" (include "zelkor-platform.fullname" .)) -}}
{{- if $live -}}
{{- $pvc = gt (len ($live.spec.volumeClaimTemplates | default list)) 0 -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-postgresql
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "postgresql") | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "zelkor-platform.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository | default "postgres" }}:{{ .Values.postgresql.image.tag | default "18.6-alpine" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-postgresql
                  key: postgres-password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-postgresql
                  key: username
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelkor-platform.fullname" . }}-postgresql
                  key: database
          args:
            - postgres
            - -c
            - log_min_messages={{ include "zelkor-platform.vendorLogLevel" (dict "root" . "component" .Values.postgresql "vendor" "postgres") }}
            - -c
            - log_destination=stderr
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.postgresql) | nindent 10 }}
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-postgresql-init
        {{- if not $pvc }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if $pvc }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $persist.size | default "8Gi" | quote }}
        {{- if $persist.storageClass }}
        storageClassName: {{ $persist.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
