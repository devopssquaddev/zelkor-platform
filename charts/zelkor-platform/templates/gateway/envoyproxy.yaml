{{- include "zelkor-platform.compile" . -}}
{{- if and .Values.gateway.enabled (eq (include "zelkor-platform.gatewayCreateGatewayClass" . | trim) "true") (eq (include "zelkor-platform.envoyProxyEmit" .) "true") }}
{{- $ep := .Values.gateway.envoyProxy | default dict -}}
{{- $svc := $ep.service | default dict -}}
{{- $svcType := $svc.type | default "" -}}
{{- $ns := $ep.nodeSelector | default dict -}}
{{- $ha := eq (include "zelkor-platform.haEnabled" .) "true" -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-envoy-proxy-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "gateway") | nindent 4 }}
spec:
  logging:
    level:
      default: {{ include "zelkor-platform.vendorLogLevel" (dict "root" . "component" .Values.gateway "vendor" "envoy") }}
  {{- $mcpOn := (.Values.mcp).enabled -}}
  {{- $v1On := .Values.aiGateway.enabled -}}
  {{- if or $mcpOn $v1On }}
  {{- /* CE-9c /mcp (mcp_access) and CE-15a-3 /v1 (llm_access) structured logs carry
       metadata only — method/backend/tool/tenant (mcp) and model/token-counts/tenant (llm),
       plus status and timing. Never bodies, params or Authorization (P11). Every other
       path keeps the EG default JSON log. */}}
  telemetry:
    accessLog:
      settings:
        - matches:
            - "!request.path.startsWith('/mcp') && !request.path.startsWith('/v1')"
          sinks:
            - type: File
              file:
                path: /dev/stdout
        {{- if $v1On }}
        - matches:
            - "request.path.startsWith('/v1')"
          format:
            type: JSON
            json:
              event: llm_access
              start_time: "%START_TIME%"
              tenant_id: "%REQ(X-TENANT-ID)%"
              gen_ai.request.model: "%REQ(X-AI-EG-MODEL)%"
              llm_input_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              llm_output_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              llm_total_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_total_token)%"
              response_code: "%RESPONSE_CODE%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              duration_ms: "%DURATION%"
              x_request_id: "%REQ(X-REQUEST-ID)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
        {{- end }}
        {{- if $mcpOn }}
        - matches:
            - "request.path.startsWith('/mcp')"
          format:
            type: JSON
            json:
              event: mcp_access
              start_time: "%START_TIME%"
              mcp_method: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_method)%"
              mcp_backend: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_backend)%"
              mcp_tool_name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_tool_name)%"
              mcp_request_id: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_request_id)%"
              tenant_id: "%REQ(X-TENANT-ID)%"
              response_code: "%RESPONSE_CODE%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              duration_ms: "%DURATION%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              x_request_id: "%REQ(X-REQUEST-ID)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
        {{- end }}
  {{- end }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ include "zelkor-platform.envoyDataplaneServiceName" . | quote }}
        {{- if $svcType }}
        type: {{ $svcType | quote }}
        {{- end }}
      {{- if $ha }}
      envoyHpa:
        minReplicas: {{ int (.Values.highAvailability.minReplicas | default 2) }}
        maxReplicas: {{ int (.Values.highAvailability.maxReplicas | default 8) }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ int (.Values.highAvailability.cpuUtilization | default 70) }}
      {{- end }}
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
              {{- if or $ns $ep.hostNetwork }}
              template:
                spec:
                  {{- if $ns }}
                  nodeSelector:
                    {{- toYaml $ns | nindent 20 }}
                  {{- end }}
                  {{- if $ep.hostNetwork }}
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  {{- end }}
              {{- end }}
        {{- with $ep.resources }}
        container:
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
{{- end }}
