{{- if and .Values.gateway.enabled (eq (include "zelkor-platform.gatewayCreateGatewayClass" . | trim) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "zelkor-platform.gatewayClassName" . }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "gateway") | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  {{- if eq (include "zelkor-platform.envoyProxyEmit" .) "true" }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "zelkor-platform.fullname" . }}-envoy-proxy-config
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
