{{- include "zelkor-platform.compile" . -}}
{{- $agentsHost := include "zelkor-platform.agentsHost" . }}
{{- $intent := .Values.__workloadIntent | default dict -}}
{{- $timeout := $intent.timeout | default "" | toString | trim -}}
{{- if and .Values.gateway.enabled .Values.aegra.enabled $agentsHost }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra-sse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "workload.intent") | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "zelkor-platform.fullname" . }}-aegra-route
  mergeType: StrategicMerge
  timeout:
    http:
      requestTimeout: {{ if $timeout }}{{ $timeout | quote }}{{ else }}0s{{ end }}
      maxStreamDuration: 0s
      streamIdleTimeout: {{ if $timeout }}{{ $timeout | quote }}{{ else }}1h{{ end }}
{{- end }}
