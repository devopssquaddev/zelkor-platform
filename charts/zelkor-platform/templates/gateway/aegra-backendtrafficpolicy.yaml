{{- if and .Values.gateway.enabled .Values.aegra.enabled .Values.gateway.hosts.aegra }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra-sse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "zelkor-platform.fullname" . }}-aegra-route
  mergeType: StrategicMerge
  timeout:
    http:
      requestTimeout: 0s
      maxStreamDuration: 0s
      streamIdleTimeout: 1h
{{- end }}
