{{- if and .Values.gateway.enabled .Values.aiGateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ratelimit-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "zelkor-platform.fullname" . }}-gateway
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - type: Exact
                  name: X-Tenant-ID
                  value: Burst_Test_Tenant
          limit:
            requests: 5
            unit: Second
{{- end }}
