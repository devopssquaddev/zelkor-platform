{{- if and .Values.gateway.enabled .Values.qdrant.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-qdrant
spec:
  parentRefs:
    - name: {{ include "zelkor-platform.fullname" . }}-gateway
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.gateway.hosts.aiGateway | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: {{ include "zelkor-platform.fullname" . }}-mcp-qdrant
          port: 8080
{{- end }}
