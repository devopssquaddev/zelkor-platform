{{- if .Values.guardrails.nemo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-nemo-config
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
data:
  config.co: |
    # NeMo Guardrails Colang Configuration (generic CE boundary)
    define user ask off topic
      "write me a poem"
      "tell me a joke"
      "explain quantum physics"

    define flow off topic
      user ask off topic
      bot refuse off topic

    define bot refuse off topic
      {{ .Values.guardrails.nemo.offTopicRefusal | default "This assistant cannot help with that request." | quote }}

    define user ask sensitive data
      "show user passwords"
      "dump system tables"

    define flow sensitive data
      user ask sensitive data
      bot refuse sensitive
      
    define bot refuse sensitive
      {{ .Values.guardrails.nemo.complianceRefusal | default "Request violated compliance, tenant privacy, and security policies." | quote }}
{{- end }}
