{{- if .Values.guardrails.nemo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-nemo-config
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
data:
  content_safety-config.yml: |
{{ tpl (.Files.Get "files/nemo-configs/content_safety/config.yml.tpl") . | indent 4 }}
  content_safety-prompts.yml: |
{{ .Files.Get "files/nemo-configs/content_safety/prompts.yml" | indent 4 }}
  content_safety-flows.co: |
{{ tpl (.Files.Get "files/nemo-configs/content_safety/flows.co.tpl") . | indent 4 }}
{{- end }}
