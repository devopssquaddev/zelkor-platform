{{- if .Values.guardrails.nemo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-nemo
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
spec:
  replicas: {{ .Values.guardrails.nemo.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: guardrails
    spec:
      containers:
        - name: nemo-guardrails
          image: "{{ .Values.guardrails.nemo.image.repository | default "python" }}:{{ .Values.guardrails.nemo.image.tag | default "3.11-slim" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir fastapi uvicorn pydantic >/dev/null 2>&1
              python /app/server.py
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: nemo-config
              mountPath: /app/server.py
              subPath: server.py
            - name: nemo-config
              mountPath: /app/config.co
              subPath: config.co
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nemo-config
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-nemo-config
{{- end }}
