{{- if .Values.guardrails.nemo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-nemo
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
spec:
  {{- if ne (include "zelkor-platform.haEnabled" .) "true" }}
  replicas: {{ .Values.guardrails.nemo.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/guardrails/configmap.yaml") . | sha256sum }}
        checksum/langfuse-otel: {{ printf "%t%s" (.Values.langfuse.init.enabled | default false) ((.Values.langfuse.extraProjects | default list) | toJson) | sha256sum }}
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: guardrails
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "zelkor-platform.langfuseBootstrapWaitInitContainer" . | nindent 8 }}
      containers:
        - name: nemo-guardrails
          image: {{ include "zelkor-platform.image" .Values.guardrails.nemo.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.guardrails.nemo.image) }}
          {{- if eq (include "zelkor-platform.nemoOtelEnabled" .) "true" }}
          command: ["opentelemetry-instrument"]
          args:
            - python
            - /app/boot.py
            - server
            - --config
            - {{ .Values.guardrails.nemo.configsDir | default "/etc/nemoguardrails/configs" | quote }}
            - --port
            - "8000"
            - --default-config-id
            - {{ .Values.guardrails.nemo.defaultConfigId | default "content_safety" | quote }}
            - --disable-chat-ui
          {{- else }}
          command: ["python", "/app/boot.py"]
          args:
            - server
            - --config
            - {{ .Values.guardrails.nemo.configsDir | default "/etc/nemoguardrails/configs" | quote }}
            - --port
            - "8000"
            - --default-config-id
            - {{ .Values.guardrails.nemo.defaultConfigId | default "content_safety" | quote }}
            - --disable-chat-ui
          {{- end }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" .Values.guardrails.nemo "name" "zelkor-nemo") | nindent 12 }}
            - name: OPENAI_API_KEY
              value: {{ .Values.aiGateway.consumerKey | default "" | quote }}
            - name: MAIN_MODEL_BASE_URL
              value: {{ include "zelkor-platform.aiGatewayInternalUrl" . | quote }}
            - name: NEMO_GUARDRAILS_NO_USAGE_STATS
              value: "1"
            - name: ENABLE_PROMETHEUS_METRICS
              value: {{ ternary "true" "false" (eq (include "zelkor-platform.serviceMonitorEnabled" .) "true") | quote }}
            {{- include "zelkor-platform.nemoOtelEnv" . | nindent 12 }}
          {{- with (include "zelkor-platform.nemoLangfuseOtelEnvFrom" . | trim) }}
          envFrom:
            {{ . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nemo-config
              mountPath: {{ printf "%s/content_safety/config.yml" (.Values.guardrails.nemo.configsDir | default "/etc/nemoguardrails/configs") | quote }}
              subPath: content_safety-config.yml
            - name: nemo-config
              mountPath: {{ printf "%s/content_safety/prompts.yml" (.Values.guardrails.nemo.configsDir | default "/etc/nemoguardrails/configs") | quote }}
              subPath: content_safety-prompts.yml
            - name: nemo-config
              mountPath: {{ printf "%s/content_safety/flows.co" (.Values.guardrails.nemo.configsDir | default "/etc/nemoguardrails/configs") | quote }}
              subPath: content_safety-flows.co
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.guardrails.nemo) | nindent 10 }}
      volumes:
        - name: nemo-config
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-nemo-config
{{- end }}
