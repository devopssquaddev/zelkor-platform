{{- if and .Values.mcp.enabled .Values.mcp.qdrantMCP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-qdrant
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-qdrant
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-qdrant
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-qdrant
spec:
  replicas: {{ .Values.mcp.qdrantMCP.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-qdrant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-qdrant
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-qdrant
          image: {{ include "zelkor-platform.image" .Values.mcp.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.mcp.image) }}
          workingDir: /app
          command: ["python", "mcp/wrappers/qdrant_server.py"]
          ports:
            - containerPort: 8080
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" .Values.mcp.qdrantMCP "name" "zelkor-mcp-qdrant") | nindent 12 }}
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: QDRANT_MCP_URL
              value: {{ include "zelkor-platform.qdrantUrl" . | quote }}
            - name: QDRANT_COLLECTION
              value: {{ .Values.mcp.qdrantMCP.collection | quote }}
            - name: AI_GATEWAY_URL
              value: {{ include "zelkor-platform.openAiBaseUrl" . | quote }}
            - name: AI_GATEWAY_API_KEY
              value: {{ .Values.aiGateway.consumerKey | default "" | quote }}
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.mcp.qdrantMCP) | nindent 10 }}
{{- end }}
