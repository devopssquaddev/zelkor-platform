{{- include "zelkor-platform.compile" . -}}
{{- include "zelkor-platform.mcpRouteValidate" . -}}
{{- if eq (include "zelkor-platform.mcpMcprouteEnabled" .) "true" }}
{{- $targetHost := include "zelkor-platform.envoyDataplaneHost" . | trim -}}
{{- if and (not $targetHost) (not (.Values.security.mcp.acceptUnprotectedBackends | default false)) -}}
{{- fail "aiGateway.inClusterService.targetHost must be set when the chart does not emit EnvoyProxy (or set security.mcp.acceptUnprotectedBackends for lab overlays)" -}}
{{- end -}}
{{- if $targetHost -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "mcp") | nindent 4 }}
    app.kubernetes.io/component: mcp-dataplane
spec:
  type: ExternalName
  externalName: {{ $targetHost }}
  ports:
    - name: http
      port: 80
      protocol: TCP
{{- end }}
{{- end }}
