{{- include "zelkor-platform.compile" . -}}
{{- if and .Values.mcp.enabled .Values.mcp.aigatewayMCP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-aigateway
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "mcp.aigatewayMCP") | nindent 4 }}
    app.kubernetes.io/component: mcp-aigateway
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-aigateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-aigateway
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "mcp.aigatewayMCP") | nindent 4 }}
    app.kubernetes.io/component: mcp-aigateway
spec:
  {{- if ne (include "zelkor-platform.haEnabled" .) "true" }}
  replicas: {{ .Values.mcp.aigatewayMCP.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-aigateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" (dict "root" . "intent" "mcp.aigatewayMCP") | nindent 8 }}
        app.kubernetes.io/component: mcp-aigateway
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-aigateway
          image: {{ include "zelkor-platform.image" .Values.mcp.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.mcp.image) }}
          workingDir: /app
          command: ["python", "mcp/wrappers/aigateway_server.py"]
          ports:
            - containerPort: 8080
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" .Values.mcp.aigatewayMCP "name" "zelkor-mcp-aigateway") | nindent 12 }}
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: AI_GATEWAY_URL
              value: {{ include "zelkor-platform.openAiBaseUrl" . | quote }}
            - name: AI_GATEWAY_API_KEY
              value: {{ .Values.aiGateway.consumerKey | default "" | quote }}
            - name: AIGATEWAY_ALLOWED_MODELS
              value: {{ join "," (.Values.mcp.aigatewayMCP.allowedModels | default list) | quote }}
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.mcp.aigatewayMCP) | nindent 10 }}
{{- end }}
