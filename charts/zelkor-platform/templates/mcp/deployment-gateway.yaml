{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-gateway
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-gateway
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: {{ .Values.mcp.gateway.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-gateway
    spec:
      containers:
        - name: mcp-gateway
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /app/mcp/common /app/mcp/gateway
              cp /code/common__tenant.py /app/mcp/common/tenant.py
              cp /code/common__mcp_server.py /app/mcp/common/mcp_server.py
              cp /code/gateway__gateway_server.py /app/mcp/gateway/gateway_server.py
              cd /app/mcp/gateway && python gateway_server.py
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_MCP_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-mcp-postgres:8080"
            - name: QDRANT_MCP_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-mcp-qdrant:8080"
            - name: SANDBOX_MCP_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-mcp-sandbox:8080"
          volumeMounts:
            - name: code
              mountPath: /code
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-mcp-code
{{- end }}
