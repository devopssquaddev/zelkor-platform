{{- if and .Values.mcp.enabled .Values.mcp.egressMCP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-egress
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-egress
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-egress
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-egress
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-egress
spec:
  replicas: {{ .Values.mcp.egressMCP.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-egress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-egress
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-egress
          image: {{ include "zelkor-platform.image" .Values.mcp.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.mcp.image) }}
          workingDir: /app
          command: ["python", "mcp/wrappers/egress_server.py"]
          ports:
            - containerPort: 8080
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" .Values.mcp.egressMCP "name" "zelkor-mcp-egress") | nindent 12 }}
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: AI_GATEWAY_URL
              value: {{ include "zelkor-platform.openAiBaseUrl" . | quote }}
            - name: AI_GATEWAY_API_KEY
              value: {{ .Values.aiGateway.consumerKey | default "" | quote }}
            - name: EGRESS_ALLOWED_MODELS
              value: {{ join "," (.Values.mcp.egressMCP.allowedModels | default list) | quote }}
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.mcp.egressMCP) | nindent 10 }}
{{- end }}
