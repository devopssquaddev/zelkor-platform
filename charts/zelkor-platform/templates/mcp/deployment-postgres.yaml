{{- if and .Values.mcp.enabled .Values.mcp.postgresMCP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-postgres
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-postgres
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-postgres
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-postgres
spec:
  replicas: {{ .Values.mcp.postgresMCP.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-postgres
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-postgres
          image: {{ include "zelkor-platform.image" .Values.mcp.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.mcp.image) }}
          workingDir: /app
          command: ["python", "mcp/wrappers/postgres_server.py"]
          ports:
            - containerPort: 8080
          env:
            {{- include "zelkor-platform.logEnv" (dict "root" . "component" .Values.mcp.postgresMCP "name" "zelkor-mcp-postgres") | nindent 12 }}
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: POSTGRES_MCP_URL
              value: {{ .Values.mcp.postgresMCP.databaseUrl | default (include "zelkor-platform.postgresUrl" (list . "postgres")) | quote }}
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.mcp.postgresMCP) | nindent 10 }}
{{- end }}
