{{- if and .Values.mcp.enabled .Values.mcp.sandboxMCP.enabled }}
{{- $fullname := include "zelkor-platform.fullname" . }}
{{- $replicas := .Values.mcp.sandboxMCP.warmPool.replicas | default 3 }}
{{- $workerUrls := list }}
{{- range $i := until (int $replicas) }}
{{- $workerUrls = append $workerUrls (printf "http://%s-mcp-sandbox-worker-%d:8081" $fullname $i) }}
{{- end }}
{{- $workerUrlsStr := join "," $workerUrls }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mcp-sandbox
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-sandbox
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: mcp-sandbox
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- range $i := until (int $replicas) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mcp-sandbox-worker-{{ $i }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-sandbox-worker
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/component: mcp-sandbox-worker
    app.kubernetes.io/instance: {{ $.Release.Name }}
    sandbox-worker-id: "{{ $i }}"
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-mcp-sandbox
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-sandbox
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-sandbox
    spec:
      containers:
        - name: mcp-sandbox
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install --no-cache-dir numpy pandas >/dev/null 2>&1 || true
              mkdir -p /app/mcp/common /app/mcp/sandbox
              cp /code/common__tenant.py /app/mcp/common/tenant.py
              cp /code/common__mcp_server.py /app/mcp/common/mcp_server.py
              cp /code/sandbox__pool_manager.py /app/mcp/sandbox/pool_manager.py
              cp /code/sandbox__server.py /app/mcp/sandbox/server.py
              export SANDBOX_WORKER_URLS="{{ $workerUrlsStr }}"
              cd /app/mcp/sandbox && python server.py
          ports:
            - containerPort: 8080
          env:
            - name: SANDBOX_WORKER_URLS
              value: {{ $workerUrlsStr | quote }}
          volumeMounts:
            - name: code
              mountPath: /code
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: {{ $fullname }}-mcp-code
---
{{- range $i := until (int $replicas) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-mcp-sandbox-worker-{{ $i }}
  labels:
    {{- include "zelkor-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-sandbox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-sandbox-worker
      app.kubernetes.io/instance: {{ $.Release.Name }}
      sandbox-worker-id: "{{ $i }}"
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.labels" $ | nindent 8 }}
        app.kubernetes.io/component: mcp-sandbox-worker
        sandbox-worker-id: "{{ $i }}"
    spec:
      {{- if $.Values.mcp.sandboxMCP.runtimeClassName }}
      runtimeClassName: {{ $.Values.mcp.sandboxMCP.runtimeClassName }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ $.Values.mcp.sandboxMCP.workerImage.repository }}:{{ $.Values.mcp.sandboxMCP.workerImage.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install --no-cache-dir numpy pandas >/dev/null 2>&1 || true
              mkdir -p /app/mcp/sandbox
              cp /code/sandbox__worker.py /app/mcp/sandbox/worker.py
              cd /app/mcp/sandbox && python worker.py
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          volumeMounts:
            - name: code
              mountPath: /code
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: {{ $fullname }}-mcp-code
---
{{- end }}
{{- end }}
