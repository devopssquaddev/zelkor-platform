{{- include "zelkor-platform.compile" . -}}
{{- if and .Values.mcp.enabled .Values.mcp.sandboxMCP.enabled }}
{{- $name := printf "%s-sandbox-worker" (include "zelkor-platform.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.mcp.sandboxMCP.workerToken | default "" -}}
{{- if and (not $token) $existing $existing.data -}}
{{- if index $existing.data "token" -}}
{{- $token = index $existing.data "token" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $token -}}
{{- $token = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "mcp.sandboxMCP") | nindent 4 }}
    app.kubernetes.io/component: mcp-sandbox
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
