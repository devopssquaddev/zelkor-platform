{{- include "zelkor-platform.compile" . -}}
{{- if eq (include "zelkor-platform.seaweedfsRender" .) "true" }}
{{- $accessKey := required "seaweedfs.auth.accessKey is required when seaweedfs.enabled" .Values.seaweedfs.auth.accessKey -}}
{{- $secretKey := required "seaweedfs.auth.secretKey is required when seaweedfs.enabled" .Values.seaweedfs.auth.secretKey -}}
{{- $obj := .Values.mcp.objectMCP | default dict -}}
{{- $ident := .Values.seaweedfs.objectIdentity | default dict -}}
{{- $objectBucket := "" -}}
{{- if and $obj.enabled ($ident.accessKey | default "" | trim) ($ident.secretKey | default "" | trim) (($obj.s3).bucket | default "" | trim) -}}
{{- $objectBucket = ($obj.s3.bucket | trim) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-seaweedfs
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "seaweedfs") | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
type: Opaque
stringData:
  access-key: {{ $accessKey | quote }}
  secret-key: {{ $secretKey | quote }}
  s3-config.json: |
    {"identities":[{"name":{{ $accessKey | quote }},"credentials":[{"accessKey":{{ $accessKey | quote }},"secretKey":{{ $secretKey | quote }}}],"actions":["Admin","Read","Write","List","Tagging"]}{{- if $objectBucket }},{"name":{{ $ident.accessKey | quote }},"credentials":[{"accessKey":{{ $ident.accessKey | quote }},"secretKey":{{ $ident.secretKey | quote }}}],"actions":["Read:{{ $objectBucket }}","Write:{{ $objectBucket }}","List:{{ $objectBucket }}","Tagging:{{ $objectBucket }}"]}{{- end }}]}
{{- end }}
