{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-ingress
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  rules:
    {{- if and .Values.langfuse.enabled .Values.ingress.hosts.langfuse }}
    - host: {{ .Values.ingress.hosts.langfuse | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zelkor-platform.fullname" . }}-langfuse
                port:
                  number: 3000
    {{- end }}
    {{- if and .Values.aiGateway.enabled .Values.ingress.hosts.aiGateway }}
    - host: {{ .Values.ingress.hosts.aiGateway | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zelkor-platform.fullname" . }}-ai-gateway
                port:
                  number: 8080
    {{- end }}
    {{- if and .Values.aegra.enabled .Values.ingress.hosts.aegra }}
    - host: {{ .Values.ingress.hosts.aegra | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zelkor-platform.fullname" . }}-aegra
                port:
                  number: 8000
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
