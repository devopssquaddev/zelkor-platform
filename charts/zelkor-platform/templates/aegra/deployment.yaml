{{- if .Values.aegra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  replicas: {{ .Values.aegra.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aegra
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: aegra
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.aegra.terminationGracePeriodSeconds | default 35 }}
      initContainers:
        - name: wait-for-deps
          image: {{ .Values.global.initContainerImage | default "busybox:1.37" }}
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 1
              done
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-valkey 6379; do
                echo "Waiting for valkey..."
                sleep 1
              done
              echo "Dependencies ready."
        - name: migrate
          image: {{ include "zelkor-platform.image" .Values.aegra.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.aegra.image) }}
          workingDir: /app
          command: ["python", "/app/migrate.py"]
          env:
            - name: DATABASE_URL
              value: {{ include "zelkor-platform.postgresUrl" (list . "aegra") | quote }}
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
      containers:
        - name: aegra
          image: {{ include "zelkor-platform.image" .Values.aegra.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.aegra.image) }}
          workingDir: /app
          command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "zelkor-platform.postgresUrl" (list . "aegra") | quote }}
            - name: REDIS_URL
              value: {{ include "zelkor-platform.valkeyUrl" . | quote }}
            - name: REDIS_BROKER_ENABLED
              value: {{ ((.Values.aegra.redisBroker).enabled | default false) | quote }}
            {{- if ((.Values.aegra.redisBroker).enabled | default false) }}
            - name: REDIS_CHANNEL_PREFIX
              value: {{ ((.Values.aegra.redis).channelPrefix | default (printf "aegra:%s:run:" .Release.Name)) | quote }}
            - name: WORKER_QUEUE_KEY
              value: {{ ((.Values.aegra.redis).queueKey | default (printf "aegra:%s:jobs" .Release.Name)) | quote }}
            {{- end }}
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: {{ (.Values.aegra.runMigrationsOnStartup | default false) | quote }}
            - name: WORKER_COUNT
              value: {{ (.Values.aegra.workerCount | default 3) | quote }}
            - name: N_JOBS_PER_WORKER
              value: {{ (.Values.aegra.nJobsPerWorker | default 10) | quote }}
            - name: WORKER_DRAIN_TIMEOUT
              value: {{ (.Values.aegra.workerDrainTimeout | default 30) | quote }}
            - name: AEGRA_CONFIG
              value: "/app/aegra.json"
            - name: TENANT_ORG_MAPPINGS
              value: {{ .Values.aegra.tenantOrgMappings | default dict | toJson | quote }}
            - name: OPENAI_BASE_URL
              value: {{ include "zelkor-platform.openAiBaseUrl" . | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.aiGateway.consumerKey | default "" | quote }}
            - name: AI_GATEWAY_URL
              value: {{ include "zelkor-platform.openAiBaseUrl" . | quote }}
            - name: MCP_URL
              value: {{ include "zelkor-platform.mcpGatewayUrl" . | quote }}
            - name: MCP_INJECT_ENABLED
              value: {{ ((.Values.aegra.mcpInject).enabled | default false) | quote }}
            - name: ZELKOR_TENANT_HEADER
              value: "X-Tenant-ID"
            - name: QDRANT_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-qdrant:6333"
            {{- include "zelkor-platform.aegraOtelEnv" . | nindent 12 }}
          volumeMounts:
            - name: agents-auth
              mountPath: /app/aegra.json
              subPath: aegra.json
            {{- if and .Values.aegra.graphModules.enabled .Values.aegra.graphModules.configMapName }}
            - name: graph-modules
              mountPath: {{ .Values.aegra.graphModules.mountPath | default "/app/graphs" | quote }}
            {{- end }}
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.aegra) | nindent 10 }}
      volumes:
        - name: agents-auth
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-agents-auth
        {{- if and .Values.aegra.graphModules.enabled .Values.aegra.graphModules.configMapName }}
        - name: graph-modules
          configMap:
            name: {{ .Values.aegra.graphModules.configMapName | quote }}
        {{- end }}
{{- end }}
