{{- if .Values.aegra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  replicas: {{ .Values.aegra.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aegra
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: aegra
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 1
              done
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-valkey 6379; do
                echo "Waiting for valkey..."
                sleep 1
              done
              echo "Dependencies ready."
      containers:
        - name: aegra
          image: "{{ .Values.aegra.image.repository | default "python" }}:{{ .Values.aegra.image.tag | default "3.11-slim" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir fastapi uvicorn pyjwt httpx pydantic psycopg2-binary redis >/dev/null 2>&1
              python /app/server.py
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.auth.username | default "zelkor" }}:{{ .Values.postgresql.auth.password | default "zelkor-dev-password" }}@{{ include "zelkor-platform.fullname" . }}-postgresql:5432/aegra"
            - name: VALKEY_URL
              value: "redis://{{ include "zelkor-platform.fullname" . }}-valkey:6379/0"
            - name: AEGRA_CONFIG
              value: "/app/agents/aegra.json"
            - name: AI_GATEWAY_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-ai-gateway:8080/v1"
            - name: QDRANT_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-qdrant:6333"
          volumeMounts:
            - name: app-code
              mountPath: /app/server.py
              subPath: server.py
            - name: agents-auth
              mountPath: /app/agents
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            {{- toYaml .Values.aegra.resources | nindent 12 }}
      volumes:
        - name: app-code
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-aegra-app
        - name: agents-auth
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-agents-auth
            defaultMode: 0755
{{- end }}
