{{- if .Values.aegra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    {{- include "zelkor-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
spec:
  replicas: {{ .Values.aegra.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "zelkor-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aegra
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: aegra
    spec:
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-deps
          image: {{ .Values.global.initContainerImage | default "busybox:1.37" }}
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 1
              done
              until nc -z -w 2 {{ include "zelkor-platform.fullname" . }}-valkey 6379; do
                echo "Waiting for valkey..."
                sleep 1
              done
              echo "Dependencies ready."
      containers:
        - name: aegra
          image: {{ include "zelkor-platform.image" .Values.aegra.image | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" .Values.aegra.image) }}
          workingDir: /app
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- include "zelkor-platform.authEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "zelkor-platform.postgresUrl" (list . "aegra") | quote }}
            - name: REDIS_URL
              value: {{ include "zelkor-platform.valkeyUrl" . | quote }}
            - name: REDIS_BROKER_ENABLED
              value: "true"
            - name: AEGRA_CONFIG
              value: "/app/aegra.json"
            - name: TENANT_ORG_MAPPINGS
              value: {{ .Values.aegra.tenantOrgMappings | default dict | toJson | quote }}
            - name: AI_GATEWAY_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-ai-gateway:8080/v1"
            - name: QDRANT_URL
              value: "http://{{ include "zelkor-platform.fullname" . }}-qdrant:6333"
          volumeMounts:
            - name: agents-auth
              mountPath: /app/aegra.json
              subPath: aegra.json
          {{- include "zelkor-platform.containerProbes" (dict "root" . "values" .Values.aegra) | nindent 10 }}
      volumes:
        - name: agents-auth
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-agents-auth
{{- end }}
