{{- if .Values.aegra.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra-app
  labels:
    {{- include "zelkor-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aegra
data:
  server.py: |
    import os
    import sys
    import json
    import logging
    from fastapi import FastAPI, Request, HTTPException, Depends, Header
    from fastapi.responses import JSONResponse
    import uvicorn
    import psycopg2
    import psycopg2.extras
    import redis

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger("aegra")

    # Import tenant auth module if available
    sys.path.insert(0, "/app")
    try:
        from agents.tenant_auth import auth, authenticate_request
    except Exception as e:
        logger.warning(f"Failed to load tenant auth module: {e}")
        auth = None
        authenticate_request = None

    DATABASE_URL = os.getenv("DATABASE_URL", "postgresql://zelkor:zelkor-dev-password@zelkor-platform-postgresql:5432/aegra")
    VALKEY_URL = os.getenv("VALKEY_URL", "redis://zelkor-platform-valkey:6379/0")

    # Initialize Valkey client
    r_client = None
    try:
        r_client = redis.from_url(VALKEY_URL, decode_responses=True)
        r_client.ping()
        logger.info("Connected to Valkey.")
    except Exception as e:
        logger.warning(f"Valkey connection failed: {e}")
        r_client = None

    def get_db():
        return psycopg2.connect(DATABASE_URL)

    def init_db():
        try:
            with get_db() as conn:
                with conn.cursor() as cur:
                    cur.execute("""
                        CREATE TABLE IF NOT EXISTS aegra_threads (
                            thread_id VARCHAR(255) PRIMARY KEY,
                            tenant_id VARCHAR(255) NOT NULL,
                            state JSONB NOT NULL DEFAULT '{}'::jsonb,
                            history JSONB NOT NULL DEFAULT '[]'::jsonb,
                            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                            updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                        );
                    """)
                conn.commit()
            logger.info("Initialized PostgreSQL aegra_threads table.")
        except Exception as e:
            logger.error(f"Failed to initialize PostgreSQL table: {e}")

    init_db()

    app = FastAPI(title="Aegra Agent Runtime", version="0.1.0")

    # Local fallback memory cache
    memory_threads_store = {}

    def get_thread(thread_id: str):
        # 1. Check Valkey
        if r_client:
            try:
                cached = r_client.get(f"aegra:thread:{thread_id}")
                if cached:
                    return json.loads(cached)
            except Exception as e:
                logger.warning(f"Valkey get error: {e}")

        # 2. Check Postgres
        try:
            with get_db() as conn:
                with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
                    cur.execute("SELECT thread_id, tenant_id, state, history FROM aegra_threads WHERE thread_id = %s", (thread_id,))
                    row = cur.fetchone()
                    if row:
                        t_data = {
                            "thread_id": row["thread_id"],
                            "tenant_id": row["tenant_id"],
                            "state": row["state"] if isinstance(row["state"], dict) else json.loads(row["state"]),
                            "history": row["history"] if isinstance(row["history"], list) else json.loads(row["history"])
                        }
                        if r_client:
                            try:
                                r_client.setex(f"aegra:thread:{thread_id}", 3600, json.dumps(t_data))
                            except Exception:
                                pass
                        return t_data
        except Exception as e:
            logger.warning(f"Postgres get error: {e}")

        # 3. Fallback to memory
        return memory_threads_store.get(thread_id)

    def save_thread(thread_id: str, tenant_id: str, state: dict, history: list):
        t_data = {
            "thread_id": thread_id,
            "tenant_id": tenant_id,
            "state": state,
            "history": history
        }
        memory_threads_store[thread_id] = t_data

        # 1. Save to Valkey
        if r_client:
            try:
                r_client.setex(f"aegra:thread:{thread_id}", 3600, json.dumps(t_data))
            except Exception as e:
                logger.warning(f"Valkey save error: {e}")

        # 2. Save to Postgres
        try:
            with get_db() as conn:
                with conn.cursor() as cur:
                    cur.execute("""
                        INSERT INTO aegra_threads (thread_id, tenant_id, state, history, updated_at)
                        VALUES (%s, %s, %s, %s, CURRENT_TIMESTAMP)
                        ON CONFLICT (thread_id) DO UPDATE SET
                            tenant_id = EXCLUDED.tenant_id,
                            state = EXCLUDED.state,
                            history = EXCLUDED.history,
                            updated_at = CURRENT_TIMESTAMP;
                    """, (thread_id, tenant_id, json.dumps(state), json.dumps(history)))
                conn.commit()
        except Exception as e:
            logger.error(f"Postgres save error: {e}")

    @app.get("/health")
    async def health():
        return {"status": "ok", "service": "aegra"}

    @app.get("/api/v1/health")
    async def api_health():
        return {"status": "ok", "service": "aegra"}

    @app.post("/threads/{thread_id}/runs")
    async def create_run(thread_id: str, request: Request, authorization: str = Header(None), x_tenant_id: str = Header(None)):
        headers = dict(request.headers)
        if authenticate_request:
            auth_context = await authenticate_request(headers)
            identity = auth_context.get("identity")
        else:
            identity = x_tenant_id or "default"

        body = await request.json()
        input_data = body.get("input", {})

        thread = get_thread(thread_id)
        if not thread:
            thread = {
                "thread_id": thread_id,
                "tenant_id": identity,
                "history": [],
                "state": {}
            }
        elif thread["tenant_id"] != identity:
            raise HTTPException(status_code=403, detail="Cross-tenant access forbidden")

        thread["history"].append(input_data)
        if "state" in input_data and isinstance(input_data["state"], dict):
            thread["state"].update(input_data["state"])

        save_thread(thread_id, identity, thread["state"], thread["history"])

        return {
            "run_id": f"run-{len(thread['history'])}",
            "thread_id": thread_id,
            "tenant_id": identity,
            "status": "completed",
            "output": {"message": f"Processed for tenant {identity}"}
        }

    @app.get("/threads/{thread_id}/state")
    async def get_state(thread_id: str, request: Request, authorization: str = Header(None), x_tenant_id: str = Header(None)):
        headers = dict(request.headers)
        if authenticate_request:
            auth_context = await authenticate_request(headers)
            identity = auth_context.get("identity")
        else:
            identity = x_tenant_id or "default"

        thread = get_thread(thread_id)
        if not thread:
            raise HTTPException(status_code=404, detail="Thread not found")

        if thread["tenant_id"] != identity:
            raise HTTPException(status_code=403, detail="Cross-tenant access forbidden")

        return {
            "thread_id": thread_id,
            "tenant_id": identity,
            "values": thread["state"],
            "history": thread["history"]
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8000)
{{- end }}
