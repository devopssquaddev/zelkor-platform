{{- include "zelkor-platform.compile" . -}}
{{- $jwt := ((.Values.platform.tenants).jwt | default dict) -}}
{{- $ls := ($jwt.localSigning | default dict) -}}
{{- $pk := $ls.privateKey | default "" | trim -}}
{{- if and $ls.enabled $pk }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-tenant-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "platform.tenants.jwt") | nindent 4 }}
    app.kubernetes.io/component: tenant-jwt-signing
type: Opaque
stringData:
  privateKey: |
{{ $pk | nindent 4 }}
  kid: {{ printf "zelkor-%s" ($ls.rotationId | default "1") | quote }}
{{- end }}
