{{- include "zelkor-platform.compile" . -}}
{{- if eq (include "zelkor-platform.gvisorInstallerEnabled" .) "true" }}
{{- $prov := .Values.security.sandbox.provisioning | default dict }}
{{- $installer := $prov.installer | default dict }}
{{- $containerd := $installer.containerd | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-install-script
  namespace: kube-system
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
    app.kubernetes.io/component: gvisor-installer
data:
  install-on-node.sh: |
{{ .Files.Get "files/gvisor/install-on-node.sh" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
  namespace: kube-system
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
    app.kubernetes.io/component: gvisor-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
    app.kubernetes.io/component: gvisor-installer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
    app.kubernetes.io/component: gvisor-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
subjects:
  - kind: ServiceAccount
    name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
  namespace: kube-system
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
    app.kubernetes.io/component: gvisor-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gvisor-installer
  template:
    metadata:
      labels:
        {{- include "zelkor-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gvisor-installer
    spec:
{{ include "zelkor-platform.gvisorNodeScheduling" . | indent 6 }}
      serviceAccountName: {{ include "zelkor-platform.fullname" . }}-gvisor-installer
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- include "zelkor-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: install
          image: {{ include "zelkor-platform.image" ($installer.image | default dict) | quote }}
          imagePullPolicy: {{ include "zelkor-platform.imagePullPolicy" (dict "root" . "image" ($installer.image | default dict)) }}
          securityContext:
            privileged: true
          {{- with $installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GVISOR_RELEASE
              value: {{ include "zelkor-platform.gvisorRelease" . | quote }}
            - name: GVISOR_BASE_URL
              value: {{ $prov.baseUrl | default "https://storage.googleapis.com/gvisor/releases/release" | quote }}
            - name: VERIFY_CHECKSUM
              value: {{ $prov.verifyChecksum | default false | quote }}
            - name: HOST_ROOT
              value: /host
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GVISOR_READY_LABEL
              value: {{ include "zelkor-platform.gvisorReadyLabelKey" . | quote }}
            {{- with $containerd.dropInDir }}
            - name: DROP_IN_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- with $containerd.configPaths }}
            - name: CONFIG_PATHS
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with $containerd.restartUnits }}
            - name: RESTART_UNITS
              value: {{ join " " . | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache curl bash zstd >/dev/null
              label_node() {
                val="$1"
                if [ "$val" = "true" ]; then
                  body="{\"metadata\":{\"labels\":{\"${GVISOR_READY_LABEL}\":\"true\"}}}"
                else
                  body="{\"metadata\":{\"labels\":{\"${GVISOR_READY_LABEL}\":null}}}"
                fi
                curl -fsS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH \
                  "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/nodes/${NODE_NAME}" \
                  -d "$body" >/dev/null
              }
              while true; do
                if bash /scripts/install-on-node.sh && label_node true; then
                  sleep 3600
                else
                  label_node false || true
                  sleep 30
                fi
              done
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: install-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: install-script
          configMap:
            name: {{ include "zelkor-platform.fullname" . }}-gvisor-install-script
            defaultMode: 0555
{{- end }}
