{{- include "zelkor-platform.compile" . -}}
{{- if and .Values.security.networkPolicies.enabled (or .Values.aegra.enabled .Values.mcp.enabled) }}
{{- $fullname := include "zelkor-platform.fullname" . }}
{{- $ns := .Release.Namespace }}
---
# Default-deny egress for generic agent workloads (not Aegra checkpointer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-agent-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      zelkor.io/workload-type: agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10080
    {{- if .Values.aegra.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: aegra
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    {{- /* No direct NeMo: models only via the AI Gateway, which requires the caller key. */}}
    {{- if .Values.langfuse.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: langfuse
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
{{- if .Values.aegra.enabled }}
---
# Aegra runtimes (front door + workers) need Postgres + Valkey for the checkpointer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-aegra-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: aegra
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10080
    {{- /* No direct NeMo: models only via the AI Gateway, which requires the caller key. */}}
    {{- if .Values.langfuse.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: langfuse
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    {{- include "zelkor-platform.jwksEgressRules" . | nindent 4 }}
{{- end }}
{{- if .Values.mcp.postgresMCP.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mcp-postgres-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-postgres
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- include "zelkor-platform.dataToolEgress" (dict "egressTo" (.Values.mcp.postgresMCP.egressTo | default list) "component" "postgresql" "port" 5432) | nindent 4 }}
    {{- include "zelkor-platform.jwksEgressRules" . | nindent 4 }}
{{- end }}
{{- if .Values.mcp.qdrantMCP.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mcp-qdrant-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-qdrant
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- include "zelkor-platform.dataToolEgress" (dict "egressTo" (.Values.mcp.qdrantMCP.egressTo | default list) "component" "qdrant" "port" 6333) | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10080
    {{- include "zelkor-platform.jwksEgressRules" . | nindent 4 }}
{{- end }}
{{- if and .Values.mcp.aigatewayMCP .Values.mcp.aigatewayMCP.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mcp-aigateway-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-aigateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10080
    {{- include "zelkor-platform.jwksEgressRules" . | nindent 4 }}
{{- end }}
{{- if .Values.mcp.sandboxMCP.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-sandbox-worker-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-sandbox-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-sandbox
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
{{- $surfaces := .Values.langfuse.surfaces | default dict }}
{{- $llmConn := $surfaces.llmConnection | default dict }}
{{- $seedTools := and $surfaces.tools $surfaces.tools.seedFromMcp }}
{{- if or $llmConn.enabled $seedTools }}
---
# Langfuse may reach in-cluster datastores + AI Gateway / MCP. No public internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-langfuse-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: langfuse
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
{{- end }}
{{- if .Values.langfuse.enabled }}
---
# Langfuse bootstrap Job needs Postgres, Valkey, Langfuse, MCP, and AI Gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-langfuse-bootstrap-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - langfuse-bootstrap
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.langfuse.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: langfuse
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ (.Values.gateway.dataplane).namespace | default "envoy-gateway-system" | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 10080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
{{- end }}
{{- if (.Values.mcp.objectMCP).enabled }}
{{- $s3 := .Values.mcp.objectMCP.s3 -}}
{{- $parsed := urlParse $s3.endpoint -}}
{{- $hostport := $parsed.host | default "" -}}
{{- $port := "" -}}
{{- if contains ":" $hostport -}}
{{- $port = regexReplaceAll "^.*:" $hostport "" -}}
{{- else if eq ($parsed.scheme | default "http") "https" -}}
{{- $port = "443" -}}
{{- else -}}
{{- $port = "80" -}}
{{- end -}}
{{- $inCluster := eq (include "zelkor-platform.objectStoreInCluster" .) "true" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mcp-object-egress
  namespace: {{ $ns }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "security") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-object
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $inCluster }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: seaweedfs
      ports:
        - protocol: TCP
          port: {{ $port }}
    {{- else }}
    {{- range $s3.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $port }}
    {{- end }}
    {{- end }}
    {{- include "zelkor-platform.jwksEgressRules" . | nindent 4 }}
{{- end }}
{{- else if .Values.security.networkPolicies.enabled }}
{{- fail "security.networkPolicies.enabled requires workload.agents.enabled or workspace.tools.enabled. Zelkor NetworkPolicies isolate agent and tool traffic; with both off nothing would be enforced. Enable one, or set security.networkPolicies.enabled=false and isolate Langfuse and the datastores with your own policies. See docs/architecture-network.md." }}
{{- end }}
