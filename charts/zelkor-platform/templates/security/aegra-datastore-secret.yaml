{{- include "zelkor-platform.compile" . -}}
{{- if .Values.aegra.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-aegra-datastore
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "aegra") | nindent 4 }}
    app.kubernetes.io/component: aegra
type: Opaque
stringData:
  DATABASE_URL: {{ include "zelkor-platform.postgresUrl" (list . "aegra") | quote }}
  REDIS_URL: {{ include "zelkor-platform.valkeyUrl" . | quote }}
{{- end }}
