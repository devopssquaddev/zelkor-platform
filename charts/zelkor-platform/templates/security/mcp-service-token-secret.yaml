{{- include "zelkor-platform.compile" . -}}
{{- $jwt := ((.Values.platform.tenants).jwt | default dict) -}}
{{- $ls := ($jwt.localSigning | default dict) -}}
{{- $tools := (((.Values.platform.telemetry).langfuse).surfaces.tools | default dict) -}}
{{- $tok := $tools.authToken | default "" | trim -}}
{{- if and $ls.enabled $tok }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelkor-platform.fullname" . }}-mcp-service-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zelkor-platform.labels" (dict "root" . "intent" "platform.tenants.jwt") | nindent 4 }}
    app.kubernetes.io/component: mcp-service-token
type: Opaque
stringData:
  token: {{ $tok | quote }}
{{- end }}
