[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelkor"
version = "0.1.0"
description = "Zelkor CLI — one packager for every agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "langgraph-sdk==0.4.2",
]

[project.scripts]
zelkor = "zelkor.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
