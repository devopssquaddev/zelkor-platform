# Source: zelkor-platform/templates/security/gvisor-node-installer.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zelkor-platform-gvisor-installer
  namespace: kube-system
  labels:
    helm.sh/chart: zelkor-platform-2.0.0
    app.kubernetes.io/name: zelkor-platform
    app.kubernetes.io/instance: zelkor-platform
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    zelkor.io/intent: "security"
    app.kubernetes.io/component: gvisor-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: zelkor-platform
      app.kubernetes.io/component: gvisor-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zelkor-platform
        app.kubernetes.io/instance: zelkor-platform
        app.kubernetes.io/component: gvisor-installer
    spec:
      
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: true
      
      containers:
        - name: install
          image: "alpine:3.22"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: GVISOR_RELEASE
              value: "20260817"
            - name: GVISOR_BASE_URL
              value: "https://storage.googleapis.com/gvisor/releases/release"
            - name: VERIFY_CHECKSUM
              value: "false"
            - name: HOST_ROOT
              value: /host
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache curl bash >/dev/null
              while true; do
                bash /scripts/install-on-node.sh && sleep 3600 || sleep 30
              done
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: install-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: install-script
          configMap:
            name: zelkor-platform-gvisor-install-script
            defaultMode: 0555
