apiVersion: batch/v1
kind: Job
metadata:
  name: zelkor-platform-gvisor-verify
  labels:
    helm.sh/chart: zelkor-platform-2.0.0
    app.kubernetes.io/name: zelkor-platform
    app.kubernetes.io/instance: zelkor-platform
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    zelkor.io/intent: "security"
    app.kubernetes.io/component: gvisor-verify
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zelkor-platform
        app.kubernetes.io/instance: zelkor-platform
        app.kubernetes.io/component: gvisor-verify
    spec:
      restartPolicy: Never
      runtimeClassName: gvisor
      
      containers:
        - name: verify
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if dmesg 2>/dev/null | grep -qi gvisor; then
                echo "gVisor sandbox verified (gVisor kernel banner in dmesg)"
                exit 0
              fi
              echo "gVisor verify failed: host kernel dmesg (runsc not active)" >&2
              echo "WARNING: failClosed=false; continuing without gVisor sandbox" >&2
              exit 0
