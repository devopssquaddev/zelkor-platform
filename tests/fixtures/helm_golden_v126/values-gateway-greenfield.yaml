      initContainers:
        - name: wait-for-deps
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              
              until nc -z -w 2 zelkor-platform-postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 1
              done
              until nc -z -w 2 zelkor-platform-clickhouse 8123; do
                echo "Waiting for clickhouse..."
                sleep 1
              done
              until nc -z -w 2 zelkor-platform-valkey 6379; do
                echo "Waiting for valkey..."
                sleep 1
              done
              until nc -z -w 2 zelkor-platform-seaweedfs 8333; do
                echo "Waiting for seaweedfs..."
                sleep 1
              done
              echo "Dependencies ready."
      containers:
        - name: langfuse-worker
          image: "langfuse/langfuse-worker:4.24.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
              name: http
          env:
            
            - name: DATABASE_URL
