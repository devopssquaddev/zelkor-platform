# Source: zelkor-platform/templates/aegra/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zelkor-platform-aegra
  labels:
    helm.sh/chart: zelkor-platform-2.0.0
    app.kubernetes.io/name: zelkor-platform
    app.kubernetes.io/instance: zelkor-platform
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    zelkor.io/intent: "aegra"
    app.kubernetes.io/component: aegra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zelkor-platform
      app.kubernetes.io/instance: zelkor-platform
      app.kubernetes.io/component: aegra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zelkor-platform
        app.kubernetes.io/instance: zelkor-platform
        app.kubernetes.io/component: aegra
    spec:
      
      terminationGracePeriodSeconds: 35
      initContainers:
        
        - name: wait-for-deps
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 zelkor-platform-postgresql 5432; do
                echo "Waiting for postgresql..."
                sleep 1
              done
              until nc -z -w 2 zelkor-platform-valkey 6379; do
                echo "Waiting for valkey..."
                sleep 1
              done
              echo "Dependencies ready."
        - name: migrate
          image: "ghcr.io/devopssquaddev/zelkor-aegra-cli:2.0.0"
          imagePullPolicy: IfNotPresent
          command: ["aegra", "db", "upgrade"]
          env:
            - name: ZELKOR_LOG_LEVEL
              value: "INFO"
            - name: ZELKOR_LOG_FORMAT
              value: "json"
            - name: ZELKOR_LOG_COMPONENT
              value: "zelkor-aegra-cli"
            - name: DATABASE_URL
              value: "postgresql://zelkor:test-pg@zelkor-platform-postgresql:5432/aegra"
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
      containers:
        - name: aegra
          image: "ghcr.io/devopssquaddev/zelkor-aegra:2.0.0"
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ZELKOR_LOG_LEVEL
              value: "INFO"
            - name: ZELKOR_LOG_FORMAT
              value: "json"
            - name: ZELKOR_LOG_COMPONENT
              value: "zelkor-aegra"
            
            - name: LOG_EXCLUDE_PATHS
              value: "/health,/live,/ready"
            - name: AUTH_DEV_TOKENS_ENABLED
              value: "false"
            - name: AUTH_DEV_TOKEN_PREFIX
              value: ""
            - name: AUTH_TRUST_TENANT_HEADER
              value: "false"
            - name: AUTH_JWT_SECRET
              value: ""
            - name: TENANT_ORG_MAPPINGS
              value: "{}"
            - name: DATABASE_URL
              value: "postgresql://zelkor:test-pg@zelkor-platform-postgresql:5432/aegra"
            - name: REDIS_URL
              value: "redis://zelkor-platform-valkey:6379/0"
            - name: REDIS_BROKER_ENABLED
              value: "false"
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
            - name: WORKER_COUNT
              value: "3"
            - name: N_JOBS_PER_WORKER
              value: "10"
            - name: WORKER_DRAIN_TIMEOUT
              value: "30"
            - name: AEGRA_CONFIG
              value: "/app/aegra.json"
            - name: OPENAI_BASE_URL
              value: "http://zelkor-platform-ai-gateway:80/v1"
            - name: OPENAI_API_KEY
              value: ""
            - name: AI_GATEWAY_URL
              value: "http://zelkor-platform-ai-gateway:80/v1"
            - name: MCP_URL
              value: "http://zelkor-platform-mcp-gateway:8080"
            - name: ZELKOR_RUN_TIMEOUT
              value: ""
            - name: ZELKOR_MAX_TOKENS
              value: "0"
            - name: ZELKOR_APPROVAL_THRESHOLD
              value: ""
            - name: ZELKOR_APPROVAL_REQUIRED
              value: "false"
            - name: MCP_INJECT_ENABLED
              value: "false"
            - name: ZELKOR_TENANT_HEADER
              value: "X-Tenant-ID"
            - name: QDRANT_URL
              value: "http://zelkor-platform-qdrant:6333"
            - name: ENABLE_PROMETHEUS_METRICS
              value: "false"
            
          volumeMounts:
            - name: agents-auth
              mountPath: /app/aegra.json
              subPath: aegra.json
          
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: agents-auth
          configMap:
            name: zelkor-platform-agents-auth
