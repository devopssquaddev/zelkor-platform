            - name: REDIS_PORT
              value: "6379"
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: zelkor-platform-langfuse
                  key: salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: zelkor-platform-langfuse
                  key: encryption-key
