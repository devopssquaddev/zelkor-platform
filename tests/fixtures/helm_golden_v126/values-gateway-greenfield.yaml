apiVersion: apps/v1
kind: Deployment
metadata:
  name: zelkor-platform-seaweedfs
  labels:
    helm.sh/chart: zelkor-platform-2.0.0
    app.kubernetes.io/name: zelkor-platform
    app.kubernetes.io/instance: zelkor-platform
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
    zelkor.io/intent: "seaweedfs"
    app.kubernetes.io/component: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zelkor-platform
      app.kubernetes.io/instance: zelkor-platform
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zelkor-platform
        app.kubernetes.io/instance: zelkor-platform
        app.kubernetes.io/component: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: "chrislusf/seaweedfs:4.44"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /data
              exec weed -v=0 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-config.json
          ports:
            - containerPort: 8333
              name: s3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: 8333
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 8333
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: s3-config
          secret:
            secretName: zelkor-platform-seaweedfs
            items:
              - key: s3-config.json
                path: s3-config.json
