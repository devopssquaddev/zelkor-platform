kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 10080
        hostPort: 8088
        protocol: TCP
      - containerPort: 10443
        hostPort: 8443
        protocol: TCP
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["http://zelkor-registry-docker:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."zelkor-registry-docker:5000".tls]
      insecure_skip_verify = true
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."ghcr.io"]
      endpoint = ["http://zelkor-registry-ghcr:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."zelkor-registry-ghcr:5000".tls]
      insecure_skip_verify = true
  - |-
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc]
      runtime_type = "io.containerd.runsc.v1"
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
      runtime_type = "io.containerd.runsc.v1"
