# Perimeter profile — zero-database Envoy AI & MCP egress boundary.
# Production-safe: sets only the profile. Layer it on the production overlay and supply a
# provider credential, the agents host, and your IdP's tenant-JWT contract:
#
#   helm upgrade --install zelkor-platform charts/zelkor-platform \
#     -f profiles/values-production.yaml -f profiles/values-perimeter.yaml \
#     --set workspace.models.providers.openai.apiKey=sk-... \
#     --set gateway.hosts.agents=agents.example.com \
#     --set platform.tenants.jwt.issuer=https://idp.example.com \
#     --set "platform.tenants.jwt.audiences={zelkor}" \
#     --set platform.tenants.jwt.remoteJwksUri=https://idp.example.com/.well-known/jwks.json \
#     --set "platform.tenants.jwt.jwksEgressCIDRs={<idp-cidr>}"
#
# Or: ./scripts/install-production.sh --profile perimeter (see docs/perimeter.md).
# The profile disables all datastores, Langfuse, the Aegra runtime, sandbox, NeMo and the
# data-plane MCP backends; it keeps the gateway, the gateway MCP backend, the agents front door
# and the default-deny NetworkPolicy.
---
profile: perimeter
