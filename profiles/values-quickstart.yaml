# Evaluation on any Kubernetes — still databases.mode: in-cluster-basic.
# No kind hosts, unsigned auth, or lab secrets. Customer supplies Secrets / --set.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-quickstart.sh
#   # or:
#   helm upgrade --install zelkor-platform charts/zelkor-platform \
#     -f profiles/values-quickstart.yaml \
#     -f profiles/values-gateway-greenfield.yaml \
#     --set aiGateway.providers.openai.apiKey=... \
#     --set langfuse.nextauthSecret=... --set langfuse.salt=... --set langfuse.encryptionKey=...
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: in-cluster-basic
highAvailability:
  enabled: false
security:
  sandbox:
    provisioning:
      verifyChecksum: true
  networkPolicies:
    enabled: false
gateway:
  envoyProxy:
    hostNetwork: false
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
    devTokens:
      enabled: false
    trustTenantHeader: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: true
        evaluators:
          seedCode: true
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
workload: {}
