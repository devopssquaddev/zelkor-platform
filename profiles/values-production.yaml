# Path B overlay — operator-backed datastores on customer Kubernetes.
# No kind hosts, unsigned auth, or lab secrets.
# install-production.sh generates install secrets when env is unset (cluster Secrets).
# Override: POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, SEAWEEDFS_*, WORKER_TOKEN, LANGFUSE_*.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-production.sh \
#     --hosts-agents agents.example.com --hosts-langfuse langfuse.example.com
# Public AI Gateway /v1 is opt-in (--set gateway.hosts.aiGateway=...). Do not set hosts.mcp / hosts.nemo.
#
# HA is on. Requires metrics-server.
# TLS: --set gateway.tls.enabled=true --set gateway.tls.clusterIssuer=<ClusterIssuer name>
# Prometheus Operator: --set observability.serviceMonitor.enabled=true
# Envoy Gateway + AI Gateway controllers: scale to 2 (kind ./install.sh stays 1):
#   kubectl -n envoy-gateway-system scale deploy/envoy-gateway --replicas=2
#   kubectl -n envoy-ai-gateway-system scale deploy/ai-gateway-controller --replicas=2
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: operator-cr
  postgresql:
    instances: 3
    # Aegra, Langfuse web and worker scale to 8 pods each, plus agents: 100 slots run out.
    parameters:
      max_connections: "300"
    storage:
      size: 50Gi
      storageClass: ''
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
  clickhouse:
    ha: false
    storage:
      size: 100Gi
      storageClass: ''
highAvailability:
  enabled: true
observability:
  serviceMonitor:
    enabled: false
security:
  sandbox:
    enabled: true
    failClosed: false
    provisioning:
      verifyChecksum: true
    executionLog:
      includeStdoutPreview: false
  networkPolicies:
    enabled: true
gateway:
  envoyProxy:
    hostNetwork: false
  tls:
    enabled: false
    clusterIssuer: ''
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: false
        evaluators:
          seedCode: true
        image:
          tag: 2.4.2
          digest: sha256:07a6e7ca6886a90331fd522ec754ed773872f841636a160c9748582aca33123b
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
  policies:
    nemo:
      image:
        tag: 2.4.2
        digest: sha256:669274b4ba890f9f66b7d1f78bcedb830180b4e6c79c2c3f1608d3b29a776c62
  tools:
    image:
      tag: 2.4.2
      digest: sha256:04688775992a4c0fa953568265db23557cb64735858f3ad8dc272eb6ac6727ce
    sandboxMCP:
      workerImage:
        tag: 2.4.2
        digest: sha256:cbc7c0b2b96873ef13231f3ce50ef8483a2efeeb9886551df63038cae37b2be1
workload:
  agents:
    image:
      tag: 2.4.2
      digest: sha256:2d8b38772ab2c76cf0fc6a02a889bab7214c7930fd058895d2ae08cdf124daab
    cli:
      image:
        tag: 2.4.2
        digest: sha256:efa02eae4c03e844c3734f8fbc85bbd58f9bcb7272aec01334cc32194a9474ff
