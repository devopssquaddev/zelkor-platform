# Path B overlay — operator-backed datastores on customer Kubernetes.
# No kind hosts, unsigned auth, or lab secrets.
# install-production.sh generates install secrets when env is unset (cluster Secrets).
# Override: POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, SEAWEEDFS_*, WORKER_TOKEN, LANGFUSE_*.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-production.sh \
#     --hosts-agents agents.example.com --hosts-langfuse langfuse.example.com
# Public AI Gateway /v1 is opt-in (--set gateway.hosts.aiGateway=...). Do not set hosts.mcp / hosts.nemo.
#
# HA is on. Requires metrics-server.
# TLS: --set gateway.tls.enabled=true --set gateway.tls.clusterIssuer=<ClusterIssuer name>
# Prometheus Operator: --set observability.serviceMonitor.enabled=true
# Envoy Gateway + AI Gateway controllers: scale to 2 (kind ./install.sh stays 1):
#   kubectl -n envoy-gateway-system scale deploy/envoy-gateway --replicas=2
#   kubectl -n envoy-ai-gateway-system scale deploy/ai-gateway-controller --replicas=2
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: operator-cr
  postgresql:
    instances: 3
    # Aegra, Langfuse web and worker scale to 8 pods each, plus agents: 100 slots run out.
    parameters:
      max_connections: "300"
    storage:
      size: 50Gi
      storageClass: ''
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
  clickhouse:
    ha: false
    storage:
      size: 100Gi
      storageClass: ''
highAvailability:
  enabled: true
observability:
  serviceMonitor:
    enabled: false
security:
  sandbox:
    enabled: true
    failClosed: false
    provisioning:
      verifyChecksum: true
    executionLog:
      includeStdoutPreview: false
  networkPolicies:
    enabled: true
gateway:
  envoyProxy:
    hostNetwork: false
  tls:
    enabled: false
    clusterIssuer: ''
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: false
        evaluators:
          seedCode: true
        image:
          tag: 2.5.3
          digest: sha256:17c79d3160cb736cbdf33e9c1aaa0e1979227ad16f6c3b5460cca416006815fa
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
  policies:
    nemo:
      image:
        tag: 2.5.3
        digest: sha256:4a9f3005af419e4e8eb4f847a345f3f387c28800cf65b77f5ff56d6e15f0387e
  tools:
    image:
      tag: 2.5.3
      digest: sha256:05422f824f1ff6b22f49c25416d961b55ac99accaac7cb57ea9a9e96ebf1bea7
    sandboxMCP:
      workerImage:
        tag: 2.5.3
        digest: sha256:368a49aeb0681ff2ecd4e6538df4f7646c1d4910e26b5d170781be0b0c61e76b
workload:
  agents:
    image:
      tag: 2.5.3
      digest: sha256:99fcfb11a21b3c435b0762645fa05162eac0c2b0a8ac1476fdd9142208915701
    cli:
      image:
        tag: 2.5.3
        digest: sha256:4af697b36b8e257158b1b9998534c86242368bef32bb62d3b0fd4d1a8607aa3c
