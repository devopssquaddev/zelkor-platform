# Path B overlay — operator-backed datastores on customer Kubernetes.
# No kind hosts, unsigned auth, or lab secrets.
# install-production.sh generates install secrets when env is unset (cluster Secrets).
# Override: POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, SEAWEEDFS_*, WORKER_TOKEN, LANGFUSE_*.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-production.sh \
#     --hosts-agents agents.example.com --hosts-langfuse langfuse.example.com
# Public AI Gateway /v1 is opt-in (--set gateway.hosts.aiGateway=...). Do not set hosts.mcp / hosts.nemo.
#
# HA is on. Requires metrics-server.
# TLS: --set gateway.tls.enabled=true --set gateway.tls.clusterIssuer=<ClusterIssuer name>
# Prometheus Operator: --set observability.serviceMonitor.enabled=true
# Envoy Gateway + AI Gateway controllers: scale to 2 (kind ./install.sh stays 1):
#   kubectl -n envoy-gateway-system scale deploy/envoy-gateway --replicas=2
#   kubectl -n envoy-ai-gateway-system scale deploy/ai-gateway-controller --replicas=2
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: operator-cr
  postgresql:
    instances: 3
    # Aegra, Langfuse web and worker scale to 8 pods each, plus agents: 100 slots run out.
    parameters:
      max_connections: "300"
    storage:
      size: 50Gi
      storageClass: ''
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
  clickhouse:
    ha: false
    storage:
      size: 100Gi
      storageClass: ''
highAvailability:
  enabled: true
observability:
  serviceMonitor:
    enabled: false
security:
  sandbox:
    enabled: true
    failClosed: false
    provisioning:
      verifyChecksum: true
    executionLog:
      includeStdoutPreview: false
  networkPolicies:
    enabled: true
gateway:
  envoyProxy:
    hostNetwork: false
  tls:
    enabled: false
    clusterIssuer: ''
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: false
        evaluators:
          seedCode: true
        image:
          tag: 2.4.6
          digest: sha256:3583f96988afa49fa36da27682a2579c5ee2a497be53b63096a3a4283270d1ac
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
  policies:
    nemo:
      image:
        tag: 2.4.6
        digest: sha256:539ea05391e165112623f65f23e0589bdd603af4338d4d528f4d30160ec066ce
  tools:
    image:
      tag: 2.4.6
      digest: sha256:8f409382a1827f7570f18d638444c7fa0b65666b0101e283177c13914085dc31
    sandboxMCP:
      workerImage:
        tag: 2.4.6
        digest: sha256:f855d88059bf5f2d237271f714dbe8394b58d5f85024962849d8a2c3c3bfcf84
workload:
  agents:
    image:
      tag: 2.4.6
      digest: sha256:bd81f1dc6d604e5dc7efc1a5ead3f97d73f93c13842a412ba6b9f91517642e94
    cli:
      image:
        tag: 2.4.6
        digest: sha256:5320dba2eeb3e93e1b1cd8c47dffa4028f48466db825cb119967daf4774299a2
