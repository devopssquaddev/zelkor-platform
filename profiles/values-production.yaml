# Path B overlay — operator-backed datastores on customer Kubernetes.
# No kind hosts, unsigned auth, or lab secrets.
# install-production.sh generates install secrets when env is unset (cluster Secrets).
# Override: POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, SEAWEEDFS_*, WORKER_TOKEN, LANGFUSE_*.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-production.sh \
#     --hosts-agents agents.example.com --hosts-langfuse langfuse.example.com
# Public AI Gateway /v1 is opt-in (--set gateway.hosts.aiGateway=...). Do not set hosts.mcp / hosts.nemo.
#
# HA is on. Requires metrics-server.
# TLS: --set gateway.tls.enabled=true --set gateway.tls.clusterIssuer=<ClusterIssuer name>
# Prometheus Operator: --set observability.serviceMonitor.enabled=true
# Envoy Gateway + AI Gateway controllers: scale to 2 (kind ./install.sh stays 1):
#   kubectl -n envoy-gateway-system scale deploy/envoy-gateway --replicas=2
#   kubectl -n envoy-ai-gateway-system scale deploy/ai-gateway-controller --replicas=2
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: operator-cr
  postgresql:
    instances: 3
    # Aegra, Langfuse web and worker scale to 8 pods each, plus agents: 100 slots run out.
    parameters:
      max_connections: "300"
    storage:
      size: 50Gi
      storageClass: ''
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
  clickhouse:
    ha: false
    storage:
      size: 100Gi
      storageClass: ''
highAvailability:
  enabled: true
observability:
  serviceMonitor:
    enabled: false
security:
  sandbox:
    enabled: true
    failClosed: false
    provisioning:
      verifyChecksum: true
    executionLog:
      includeStdoutPreview: false
  networkPolicies:
    enabled: true
gateway:
  envoyProxy:
    hostNetwork: false
  tls:
    enabled: false
    clusterIssuer: ''
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: false
        evaluators:
          seedCode: true
        image:
          tag: 2.4.6
          digest: sha256:43b992cbd2d7f1552890467d6d697be5112e336dc1e108526f1041850fe9e23a
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
  policies:
    nemo:
      image:
        tag: 2.4.6
        digest: sha256:df1f49dd9e4a5dd321907b8673a472e3847b8b62319ccaa6a2fa0330a5b5dc73
  tools:
    image:
      tag: 2.4.6
      digest: sha256:46d6e66df862f0a8fcb8331411b1ada6709f3aa87aaf16a6a631ad0a73d933e2
    sandboxMCP:
      workerImage:
        tag: 2.4.6
        digest: sha256:1286b67348a4fce7ada0eed37d379c2e7580c320ece39a898fb015e12458a946
workload:
  agents:
    image:
      tag: 2.4.6
      digest: sha256:5322551a074d6f77ba9e787fd8585628406d350b49f566393b883d1ccfc907ea
    cli:
      image:
        tag: 2.4.6
        digest: sha256:37216ef138b156e874fe934f8ffe91ddf8bf1c4da09a1b3711348090f35ffce4
