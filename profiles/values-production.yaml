# Path B overlay — operator-backed datastores on customer Kubernetes.
# No kind hosts, unsigned auth, or lab secrets.
# install-production.sh generates install secrets when env is unset (cluster Secrets).
# Override: POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, SEAWEEDFS_*, WORKER_TOKEN, LANGFUSE_*.
#
#   OPENAI_API_KEY=sk-... ./scripts/install-production.sh \
#     --hosts-agents agents.example.com --hosts-langfuse langfuse.example.com
# Public AI Gateway /v1 is opt-in (--set gateway.hosts.aiGateway=...). Do not set hosts.mcp / hosts.nemo.
#
# HA is on. Requires metrics-server.
# TLS: --set gateway.tls.enabled=true --set gateway.tls.clusterIssuer=<ClusterIssuer name>
# Prometheus Operator: --set observability.serviceMonitor.enabled=true
# Envoy Gateway + AI Gateway controllers: scale to 2 (kind ./install.sh stays 1):
#   kubectl -n envoy-gateway-system scale deploy/envoy-gateway --replicas=2
#   kubectl -n envoy-ai-gateway-system scale deploy/ai-gateway-controller --replicas=2
#
# ./install.sh stays on profiles/values-local.yaml (kind).
---
global:
  tier: oss
databases:
  mode: operator-cr
  postgresql:
    instances: 3
    # Aegra, Langfuse web and worker scale to 8 pods each, plus agents: 100 slots run out.
    parameters:
      max_connections: "300"
    storage:
      size: 50Gi
      storageClass: ''
    barman:
      enabled: false
      destinationPath: ''
      s3CredentialsSecretRef: ''
      retentionPolicy: 30d
  clickhouse:
    ha: false
    storage:
      size: 100Gi
      storageClass: ''
highAvailability:
  enabled: true
observability:
  serviceMonitor:
    enabled: false
security:
  sandbox:
    enabled: true
    failClosed: false
    provisioning:
      verifyChecksum: true
    executionLog:
      includeStdoutPreview: false
  networkPolicies:
    enabled: true
gateway:
  envoyProxy:
    hostNetwork: false
  tls:
    enabled: false
    clusterIssuer: ''
  hosts:
    langfuse: ''
    aiGateway: ''
    agents: ''
    mcp: ''
    nemo: ''
platform:
  tenants:
    sso:
      enabled: false
  telemetry:
    langfuse:
      init:
        enabled: true
        orgId: zelkor
        orgName: Zelkor
        projectId: zelkor-platform
        projectName: Zelkor Platform
      surfaces:
        llmConnection:
          enabled: true
        tools:
          seedFromMcp: false
        evaluators:
          seedCode: true
        image:
          tag: 2.4.1
          digest: sha256:3e84ab2fea25b10639bdfebdf96921a83bc7e5c866d24ae6f2edfabd1e7ba95e
  mTLS:
    enabled: false
workspace:
  models:
    consumerKey: ''
  policies:
    nemo:
      image:
        tag: 2.4.1
        digest: sha256:72c91b57397fdffa81df7d118e4220218c4556509cfe0d06210c277a0dd077ba
  tools:
    image:
      tag: 2.4.1
      digest: sha256:fea99d673dafca9faef12d11599a0ba4180404a1d6624bcbd210e7b057e759dd
    sandboxMCP:
      workerImage:
        tag: 2.4.1
        digest: sha256:b607349baa20a8bdc0fc6e4fcf8c77bd2576580251f67edcd7e518b93d9d49da
workload:
  agents:
    image:
      tag: 2.4.1
      digest: sha256:fc54c45c910b5a7827ca7bcb4589ba62dbbc5ccbe2ca85801daf2a65ec98548f
    cli:
      image:
        tag: 2.4.1
        digest: sha256:3aed1034dc201f3849d0fd103ee6395f814c43ec49e043b3317bfbbc059b87ec
