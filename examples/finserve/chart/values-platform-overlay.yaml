# Overlay applied to the platform chart when installing the FinServe example.
# Not used for production / INSTALL_EXAMPLES=false.
mcp:
  postgresMCP:
    databaseUrl: "postgresql://finserve_mcp:zelkor-dev-password@zelkor-platform-postgresql:5432/finserve"
  qdrantMCP:
    collection: "finserve_policies"

langfuse:
  init:
    projectId: "finserve"
    projectName: "FinServe AI"

aegra:
  workers:
    - graphId: finserve-advisor
      service: finserve-desk
      port: 8000
    - graphId: finserve-research
      service: finserve-desk
      port: 8000
    - graphId: finserve-quant
      service: finserve-quant
      port: 8000
  tenantOrgMappings:
    org_alpha: Bank_Alpha
    org_beta: Bank_Beta

guardrails:
  nemo:
    extraColang: ""
    extraInputFlows:
      - regex check input
    extraRailsConfig:
      regex_detection:
        input:
          case_insensitive: true
          patterns:
            - '\bpoem\b'
            - '\bjoke\b'
            - '\bweather\b'
    complianceRefusal: "Request violated FinServe compliance, tenant privacy, and security guardrail policies."
