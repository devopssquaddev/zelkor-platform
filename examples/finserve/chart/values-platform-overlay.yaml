# Overlay applied to the platform chart when installing the FinServe example.
# Not used for production / INSTALL_EXAMPLES=false.
# Graph routing is self-register (zelkor-agent sharedRoute), not aegra.workers.
mcp:
  postgresMCP:
    databaseUrl: "postgresql://finserve_mcp:zelkor-dev-password@zelkor-platform-postgresql:5432/finserve"
  qdrantMCP:
    collection: "finserve_policies"

# Do not set langfuse.init.projectId here — that steals the platform API key.
# FinServe traces use extraProjects keys on the workers (values-local.yaml).
langfuse:
  extraProjects:
    - id: finserve
      name: FinServe AI
      publicKey: "pk-lf-finserve-dev-00000000000000000000"
      secretKey: "sk-lf-finserve-dev-00000000000000000000"

aegra:
  tenantOrgMappings:
    org_alpha: Bank_Alpha
    org_beta: Bank_Beta

guardrails:
  nemo:
    extraColang: ""
    extraInputFlows:
      - regex check input
    extraRailsConfig:
      regex_detection:
        input:
          case_insensitive: true
          patterns:
            - '\bpoem\b'
            - '\bjoke\b'
            - '\bweather\b'
    complianceRefusal: "Request violated FinServe compliance, tenant privacy, and security guardrail policies."
