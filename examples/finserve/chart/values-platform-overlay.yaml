# Overlay applied to the platform chart when installing the FinServe example.
# Not used for production / INSTALL_EXAMPLES=false.
mcp:
  postgresMCP:
    databaseUrl: "postgresql://zelkor:zelkor-dev-password@zelkor-platform-postgresql:5432/finserve"
  qdrantMCP:
    collection: "finserve_policies"

langfuse:
  init:
    projectId: "finserve"
    projectName: "FinServe AI"

aegra:
  workers:
    - graphId: finserve
      service: finserve-agent
      port: 8000
  tenantOrgMappings:
    org_alpha: Bank_Alpha
    org_beta: Bank_Beta

guardrails:
  nemo:
    offTopicRefusal: "I am the FinServe Autonomous Wealth Management Assistant. I can only assist with financial portfolios, asset allocation, and wealth management queries."
    complianceRefusal: "Request violated FinServe compliance, tenant privacy, and security guardrail policies."
