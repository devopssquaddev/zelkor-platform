# FinServe Demo Local Overrides (kind)
global:
  tier: oss

gateway:
  enabled: true
  gatewayName: "zelkor-platform-gateway"
  namespace: "default"
  host: "finserve.localhost"

agent:
  replicaCount: 1

executor:
  replicaCount: 1
  runtimeClassName: gvisor

platform:
  postgresHost: "zelkor-platform-postgresql"
  postgresPort: 5432
  postgresUser: "zelkor"
  postgresPassword: "zelkor-dev-password"
  postgresDatabase: "finserve"
  qdrantHost: "zelkor-platform-qdrant"
  qdrantPort: 6333
  qdrantUrl: "http://zelkor-platform-qdrant:6333"
  aiGatewayAutoDiscover: true
  aiGatewayNamespace: "envoy-gateway-system"
  defaultLlmModel: "gpt-oss:20b"
  aiGatewayHostHeader: "ai-gateway.localhost"
  aegraUrl: "http://zelkor-platform-aegra:8000"
  langfuseHost: "http://zelkor-platform-langfuse:3000"
  langfusePublicKey: "pk-lf-zelkor-dev-00000000000000000000"
  langfuseSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
