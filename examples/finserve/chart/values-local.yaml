# FinServe Demo Local Overrides (kind / ./install.sh only)
_rel: &rel zelkor-platform

_workerPlatform: &workerPlatform
  releaseName: *rel
  consumerKey: "dev-key"
  databaseUrl: "postgresql://zelkor:zelkor-dev-password@zelkor-platform-postgresql:5432/aegra"
  valkeyUrl: "redis://:zelkor-valkey-dev-password@zelkor-platform-valkey:6379/0"
  defaultLlmModel: "gpt-oss:20b"
  langfuseBaseUrl: "http://zelkor-platform-langfuse:3000"
  langfusePublicKey: "pk-lf-zelkor-dev-00000000000000000000"
  langfuseSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
  otelTargets: "LANGFUSE"

_auth: &auth
  jwtSecret: "zelkor-local-jwt-secret"
  devTokens:
    enabled: true
    prefix: "dev:"
  trustTenantHeader: true

_sharedRoute: &sharedRoute
  host: agents.localhost

global:
  tier: oss

gateway:
  enabled: false

desk:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *sharedRoute
  auth:
    <<: *auth
  platform:
    <<: *workerPlatform
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

quant:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *sharedRoute
  auth:
    <<: *auth
  platform:
    <<: *workerPlatform
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

coder:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *sharedRoute
  auth:
    <<: *auth
  platform:
    <<: *workerPlatform

platform:
  releaseName: *rel
  postgresUser: "zelkor"
  postgresPassword: "zelkor-dev-password"
  postgresDatabase: "finserve"
  qdrantCollection: "finserve_policies"
  langfusePublicKey: "pk-lf-zelkor-dev-00000000000000000000"
  langfuseSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
