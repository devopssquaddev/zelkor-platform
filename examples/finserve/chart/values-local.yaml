# FinServe Demo Local Overrides (kind / ./install.sh only)
_rel: &rel zelkor-platform

_agentsHost: &agentsHost
  host: agents.localhost

desk:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *agentsHost
  platform:
    releaseName: *rel
    consumerKey: "dev-key"
    mcpAuthTokenSecret: zelkor-platform-mcp-service-token
    defaultLlmModel: "gpt-oss:20b"

quant:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *agentsHost
  platform:
    releaseName: *rel
    consumerKey: "dev-key"
    mcpAuthTokenSecret: zelkor-platform-mcp-service-token
    defaultLlmModel: "gpt-oss:20b"

coder:
  logging:
    level: DEBUG
    format: json
  image:
    tag: "dev"
  sharedRoute:
    <<: *agentsHost
  platform:
    releaseName: *rel
    consumerKey: "dev-key"
    mcpAuthTokenSecret: zelkor-platform-mcp-service-token
    defaultLlmModel: "gpt-oss:20b"

global:
  tier: oss

gateway:
  enabled: false

platform:
  releaseName: *rel
  postgresUser: "zelkor"
  postgresPassword: "zelkor-dev-password"
  postgresDatabase: "finserve"
  qdrantCollection: "finserve_policies"
  langfusePublicKey: "pk-lf-zelkor-dev-00000000000000000000"
  langfuseSecretKey: "sk-lf-zelkor-dev-00000000000000000000"
