# FinServe demo — target-agnostic defaults.
# Set platform.releaseName (and the same on desk/quant/coder) or explicit URLs
# to match YOUR Zelkor platform install. Kind/test literals: values-local.yaml only.
global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

gateway:
  enabled: false
  gatewayName: ""
  namespace: ""
  host: ""

# Shared worker connection. YAML anchors keep desk/quant/coder in sync.
_workerPlatform: &workerPlatform
  releaseName: ""
  openaiBaseUrl: ""
  consumerKey: ""
  mcpUrl: ""
  databaseUrl: ""
  valkeyUrl: ""
  mcpInject: true
  defaultLlmModel: ""

_sharedRoute: &sharedRoute
  gatewayName: ""
  gatewayNamespace: ""
  host: ""

desk:
  fullnameOverride: finserve-desk
  graphIds:
    - finserve-advisor
    - finserve-research
  aegraConfig: /app/aegra-desk.json
  replicaCount: 1
  autoscaling:
    enabled: false
  sharedRoute:
    <<: *sharedRoute
  redis:
    prefix: aegra:finserve-desk
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "1.2.4"
    digest: ""
  platform:
    <<: *workerPlatform
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

quant:
  fullnameOverride: finserve-quant
  graphIds:
    - finserve-quant
  aegraConfig: /app/aegra-quant.json
  replicaCount: 1
  autoscaling:
    enabled: false
  sharedRoute:
    <<: *sharedRoute
  redis:
    prefix: aegra:finserve-quant
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "1.2.4"
    digest: ""
  platform:
    <<: *workerPlatform
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

coder:
  fullnameOverride: finserve-coder
  graphId: finserve-coder
  aegraConfig: ""
  replicaCount: 1
  autoscaling:
    enabled: false
  sharedRoute:
    <<: *sharedRoute
  redis:
    prefix: aegra:finserve-coder
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve-coder
    tag: "1.2.4"
    digest: ""
  platform:
    <<: *workerPlatform

platform:
  # Set to the Zelkor platform Helm release name to construct Service DNS.
  releaseName: ""
  # Set when the platform Postgres is CloudNativePG (operator-cr); empty on in-cluster-basic.
  cnpgClusterName: ""
  postgresHost: ""
  postgresPort: 5432
  postgresUser: ""
  postgresPassword: ""
  postgresDatabase: "finserve"
  qdrantHost: ""
  qdrantPort: 6333
  qdrantUrl: ""
  qdrantCollection: "finserve_policies"
  langfuseHost: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""

langfuseSeed:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dbInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
