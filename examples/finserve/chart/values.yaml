# FinServe demo — target-agnostic defaults.
# Workers: graphId(s) + image + platform.releaseName + sharedRoute.host.
# Kind/test literals: values-local.yaml only.
global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

gateway:
  enabled: false

_platformRelease: &platformRelease
  releaseName: ""

_agentsHost: &agentsHost
  host: ""

desk:
  fullnameOverride: finserve-desk
  graphIds:
    - finserve-advisor
    - finserve-research
  aegraConfig: /app/aegra-desk.json
  workload:
    intent:
      timeout: 180s
      maxTokens: 4096
  sharedRoute:
    <<: *agentsHost
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "2.2.1"
    digest: ""
  platform:
    <<: *platformRelease
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

quant:
  fullnameOverride: finserve-quant
  graphIds:
    - finserve-quant
  aegraConfig: /app/aegra-quant.json
  workload:
    intent:
      timeout: 180s
      maxTokens: 4096
  sharedRoute:
    <<: *agentsHost
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "2.2.1"
    digest: ""
  platform:
    <<: *platformRelease

coder:
  fullnameOverride: finserve-coder
  graphId: finserve-coder
  aegraConfig: ""
  workload:
    intent:
      timeout: 180s
      maxTokens: 4096
  sharedRoute:
    <<: *agentsHost
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve-coder
    tag: "2.2.1"
    digest: ""
  platform:
    <<: *platformRelease

platform:
  releaseName: ""
  cnpgClusterName: ""
  postgresHost: ""
  postgresPort: 5432
  postgresUser: ""
  postgresPassword: ""
  postgresDatabase: "finserve"
  qdrantHost: ""
  qdrantPort: 6333
  qdrantUrl: ""
  qdrantCollection: "finserve_policies"
  langfuseHost: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""

langfuseSeed:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

extraMcp:
  enabled: false
  name: acme
  port: 8080
  image:
    repository: ghcr.io/devopssquaddev/zelkor-mcp
    tag: "2.2.1"
    digest: ""

dbInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
