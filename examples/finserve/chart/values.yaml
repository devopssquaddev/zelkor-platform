# FinServe Demo Helm Values
global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

gateway:
  enabled: true
  gatewayName: "zelkor-platform-gateway"
  namespace: "default"
  host: "finserve.localhost"

agent:
  replicaCount: 1
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "dev"
    digest: ""
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  startupProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

executor:
  replicaCount: 1
  image:
    repository: python
    tag: "3.12-slim"
  port: 8080
  runtimeClassName: gvisor  # gVisor runtime class for untrusted code execution

platform:
  mcpUrl: "http://zelkor-platform-mcp-gateway:8080"
  postgresHost: "zelkor-platform-postgresql"
  postgresPort: 5432
  postgresUser: "zelkor"
  postgresPassword: "zelkor-dev-password"
  postgresDatabase: "finserve"
  qdrantHost: "zelkor-platform-qdrant"
  qdrantPort: 6333
  qdrantUrl: "http://zelkor-platform-qdrant:6333"
  aiGatewayUrl: "http://envoy-default-zelkor-platform-gateway.envoy-gateway-system.svc.cluster.local:80/v1"
  aiGatewayAutoDiscover: true
  aiGatewayNamespace: "envoy-gateway-system"
  defaultLlmModel: "gpt-oss:20b"
  aiGatewayHostHeader: "ai-gateway.localhost"
  aiGatewayApiKey: ""
  aegraUrl: "http://zelkor-platform-aegra:8000"
  langfuseHost: "http://zelkor-platform-langfuse:3000"
  langfusePublicKey: "pk-lf-zelkor-dev-00000000000000000000"
  langfuseSecretKey: "sk-lf-zelkor-dev-00000000000000000000"

langfuseSeed:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dbInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
