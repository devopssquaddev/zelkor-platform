# FinServe Demo Helm Values
# Worker is the zelkor-agent subchart (ClusterIP, no public HTTPRoute).
global:
  tier: oss
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

gateway:
  enabled: false
  gatewayName: "zelkor-platform-gateway"
  namespace: "default"
  host: ""

zelkor-agent:
  fullnameOverride: finserve-agent
  graphId: finserve
  replicaCount: 1
  image:
    repository: ghcr.io/devopssquaddev/zelkor-example-finserve
    tag: "dev"
    digest: ""
  platform:
    openaiBaseUrl: "http://zelkor-platform-ai-gateway:80/v1"
    consumerKey: ""
    mcpUrl: "http://zelkor-platform-mcp-gateway:8080"
    databaseUrl: ""
    valkeyUrl: ""
    mcpInject: true
    defaultLlmModel: "gpt-oss:20b"
  extraEnv:
    - name: QDRANT_COLLECTION
      value: "finserve_policies"

platform:
  postgresHost: "zelkor-platform-postgresql"
  postgresPort: 5432
  postgresUser: "zelkor"
  postgresPassword: ""
  postgresDatabase: "finserve"
  qdrantHost: "zelkor-platform-qdrant"
  qdrantPort: 6333
  qdrantUrl: "http://zelkor-platform-qdrant:6333"
  qdrantCollection: "finserve_policies"
  langfuseHost: "http://zelkor-platform-langfuse:3000"
  langfusePublicKey: ""
  langfuseSecretKey: ""

langfuseSeed:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dbInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
