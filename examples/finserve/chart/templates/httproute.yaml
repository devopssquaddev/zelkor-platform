{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "finserve.fullname" . }}-route
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "finserve.gatewayName" . | quote }}
      namespace: {{ include "finserve.gatewayNamespace" . | quote }}
  hostnames:
    - {{ required "gateway.host must be set when gateway.enabled is true" .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: finserve-desk
          port: 8000
{{- end }}
