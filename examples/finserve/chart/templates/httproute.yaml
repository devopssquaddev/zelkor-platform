{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "finserve.fullname" . }}-route
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName | default "zelkor-platform-gateway" }}
      namespace: {{ .Values.gateway.namespace | default "default" }}
  hostnames:
    - {{ .Values.gateway.host | default "finserve.localhost" | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "finserve.fullname" . }}-agent
          port: 8080
{{- end }}
