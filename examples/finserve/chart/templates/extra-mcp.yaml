{{- $x := .Values.extraMcp | default dict }}
{{- if $x.enabled }}
{{- $name := $x.name | default "acme" }}
{{- $apiKey := $x.apiKey | default "" | toString | trim }}
{{- if not $apiKey }}
{{- fail "extraMcp.apiKey is required when extraMcp.enabled" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-mcp-key" $name }}
  labels:
    app.kubernetes.io/name: extra-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-extra
type: Opaque
stringData:
  apiKey: {{ $apiKey | quote }}
---
{{- $img := $x.image | default dict }}
{{- $repo := $img.repository | default "ghcr.io/devopssquaddev/zelkor-mcp" }}
{{- $tag := $img.tag | default .Chart.AppVersion }}
{{- $digest := $img.digest | default "" }}
{{- $ref := $repo }}
{{- if $digest }}
{{- $ref = printf "%s@%s" $repo $digest }}
{{- else }}
{{- $ref = printf "%s:%s" $repo $tag }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: extra-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-extra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $x.port | default 8080 }}
      targetPort: http
  selector:
    app.kubernetes.io/component: mcp-extra
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-extra-mcp" .Release.Name }}
  labels:
    app.kubernetes.io/name: extra-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-extra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-extra
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extra-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-extra
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: extra-mcp
          image: {{ $ref | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          workingDir: /app
          command: ["python", "mcp/wrappers/echo_server.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ZELKOR_LOG_LEVEL
              value: INFO
            - name: ZELKOR_LOG_FORMAT
              value: json
            - name: ZELKOR_LOG_COMPONENT
              value: zelkor-mcp-echo
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
{{- end }}
