apiVersion: v1
kind: Service
metadata:
  name: {{ include "finserve.fullname" . }}-agent
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserve.fullname" . }}-agent
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "finserve.labels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "finserve.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository | default "python" }}:{{ .Values.agent.image.tag | default "3.11-slim" }}"
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir fastapi uvicorn pydantic psycopg2-binary httpx >/dev/null 2>&1
              python /app/agent_server.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FINSERVE_DATABASE_URL
              value: "postgresql://{{ .Values.platform.postgresUser }}:{{ .Values.platform.postgresPassword }}@{{ .Values.platform.postgresHost }}:{{ .Values.platform.postgresPort }}/{{ .Values.platform.postgresDatabase }}"
            - name: AI_GATEWAY_URL
              value: {{ .Values.platform.aiGatewayUrl | quote }}
            - name: DEFAULT_LLM_MODEL
              value: {{ .Values.platform.defaultLlmModel | default "gpt-oss:20b" | quote }}
            - name: AI_GATEWAY_HOST_HEADER
              value: {{ .Values.platform.aiGatewayHostHeader | default "ai-gateway.localhost" | quote }}
            - name: CODE_EXECUTOR_URL
              value: "http://{{ include "finserve.fullname" . }}-code-executor:8080"
            - name: AEGRA_URL
              value: {{ .Values.platform.aegraUrl | quote }}
            - name: QDRANT_URL
              value: {{ .Values.platform.qdrantUrl | default "http://zelkor-platform-qdrant:6333" | quote }}
            - name: ZELKOR_CONSUMER_KEY
              value: "zelkor-community-key"
            - name: LANGFUSE_HOST
              value: {{ .Values.platform.langfuseHost | default "http://zelkor-platform-langfuse:3000" | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.platform.langfusePublicKey | default "pk-lf-zelkor-dev-00000000000000000000" | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.platform.langfuseSecretKey | default "sk-lf-zelkor-dev-00000000000000000000" | quote }}
          volumeMounts:
            - name: code
              mountPath: /app/agent_server.py
              subPath: agent_server.py
            - name: agent-lib
              mountPath: /app/finserve_agent.py
              subPath: finserve_agent.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: {{ include "finserve.fullname" . }}-code
        - name: agent-lib
          configMap:
            name: {{ include "finserve.fullname" . }}-agent-lib
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finserve.fullname" . }}-agent-lib
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
data:
  finserve_agent.py: |
{{ .Files.Get "files/finserve_agent.py" | indent 4 }}
