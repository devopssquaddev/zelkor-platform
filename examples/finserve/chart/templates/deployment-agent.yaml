apiVersion: v1
kind: Service
metadata:
  name: {{ include "finserve.fullname" . }}-agent
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserve.fullname" . }}-agent
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "finserve.labels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "finserve.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- include "finserve.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "finserve.image" .Values.agent.image | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
          workingDir: /app
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MCP_URL
              value: {{ .Values.platform.mcpUrl | default "http://zelkor-platform-mcp-gateway:8080" | quote }}
            - name: AI_GATEWAY_URL
              value: {{ include "finserve.aiGatewayUrl" . | quote }}
            - name: DEFAULT_LLM_MODEL
              value: {{ .Values.platform.defaultLlmModel | default "gpt-oss:20b" | quote }}
            - name: AI_GATEWAY_HOST_HEADER
              value: {{ .Values.platform.aiGatewayHostHeader | default "ai-gateway.localhost" | quote }}
            {{- if .Values.platform.aiGatewayApiKey }}
            - name: AI_GATEWAY_API_KEY
              value: {{ .Values.platform.aiGatewayApiKey | quote }}
            - name: OLLAMA_API_KEY
              value: {{ .Values.platform.aiGatewayApiKey | quote }}
            {{- end }}
            - name: AEGRA_URL
              value: {{ .Values.platform.aegraUrl | quote }}
            - name: NEMO_URL
              value: {{ .Values.platform.nemoUrl | default "http://zelkor-platform-nemo:8000/v1/guardrails/input" | quote }}
            - name: ZELKOR_CONSUMER_KEY
              value: "zelkor-community-key"
            - name: LANGFUSE_HOST
              value: {{ .Values.platform.langfuseHost | default "http://zelkor-platform-langfuse:3000" | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.platform.langfusePublicKey | default "pk-lf-zelkor-dev-00000000000000000000" | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.platform.langfuseSecretKey | default "sk-lf-zelkor-dev-00000000000000000000" | quote }}
          {{- include "finserve.containerProbes" (dict "root" . "values" .Values.agent) | nindent 10 }}
