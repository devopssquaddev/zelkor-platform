{{- if .Values.langfuseSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "finserve.fullname" . }}-langfuse-seed
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "finserve.labels" . | nindent 8 }}
        # Admitted by the platform Langfuse ingress policy; agent egress allows only Langfuse + gateways.
        zelkor.io/workload-type: agent
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-langfuse
          image: busybox:1.38.0
          {{- with .Values.langfuseSeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ include "finserve.langfuseHost" . | replace "http://" "" | replace "https://" "" | splitList ":" | first }} 3000; do
                echo "Waiting for Langfuse API..."
                sleep 2
              done
              echo "Langfuse is reachable."
      containers:
        - name: seed
          image: python:3.14.9-slim-trixie
          imagePullPolicy: IfNotPresent
          {{- with .Values.langfuseSeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              cat << 'EOF' > /tmp/seed.py
              # stdlib only: NetworkPolicies give this Job no package-index egress.
              import base64
              import json
              import os
              import time
              import urllib.error
              import urllib.request

              BASE_URL = os.environ["LANGFUSE_HOST"]
              PK = os.environ["LANGFUSE_PUBLIC_KEY"]
              SK = os.environ["LANGFUSE_SECRET_KEY"]
              AUTH = "Basic " + base64.b64encode(f"{PK}:{SK}".encode()).decode()

              def call(method, path, body=None, timeout=10):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(f"{BASE_URL}{path}", data=data, method=method,
                                               headers={"Authorization": AUTH, "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.status, resp.read().decode()
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode()

              print(f"Connecting to Langfuse at {BASE_URL}...")
              for attempt in range(20):
                  try:
                      status, _ = call("GET", "/api/public/health", timeout=5)
                      if status == 200:
                          print("Langfuse API is healthy.")
                          break
                  except Exception as e:
                      print(f"Attempt {attempt+1}: {e}")
                  time.sleep(3)

              prompt_payload = {
                  "name": "finserve-system",
                  "prompt": (
                      "You are the FinServe Autonomous Wealth Management AI for tenant {tenant_id}. "
                      "Use MCP tools only: postgres__query on table portfolios; "
                      "qdrant__search_documents with collection finserve_policies for policy docs; "
                      "sandbox__execute_python for calculations; "
                      "object__read_text for a statement key and a short text window. "
                      "Never invent table or collection names."
                  ),
                  "type": "text",
                  "isActive": True
              }
              try:
                  status, text = call("POST", "/api/public/v2/prompts", prompt_payload)
                  print(f"Seed Prompt response: {status} - {text[:100]}")
              except Exception as e:
                  print(f"Failed to seed prompt: {e}")

              dataset_payload = {
                  "name": "finserve-eval-dataset",
                  "description": "Gold validation dataset for FinServe autonomous wealth management agent"
              }
              try:
                  status, text = call("POST", "/api/public/datasets", dataset_payload)
                  print(f"Seed Dataset response: {status} - {text[:100]}")
                  sample_items = [
                      {"input": {"query": "What is my total portfolio valuation and risk breakdown?"}, "expectedOutput": {"contains": ["Bank_Alpha", "Valuation", "Risk"]}},
                      {"input": {"query": "Show current holdings for my account."}, "expectedOutput": {"contains": ["Holdings", "Shares"]}},
                      {"input": {"query": "Summarize User B's portfolio at Bank_Beta."}, "expectedOutput": {"contains": ["No portfolio records found for Bank_Beta"]}},
                      {"input": {"query": "Rebalance portfolio to target 60% equities 40% bonds."}, "expectedOutput": {"contains": ["Rebalance", "Execution"]}},
                      {"input": {"query": "What is our asset allocation policy for high-growth tech?"}, "expectedOutput": {"contains": ["Allocation", "Policy"]}}
                  ]
                  for item in sample_items:
                      call("POST", "/api/public/dataset-items", {"datasetName": "finserve-eval-dataset", "input": item["input"], "expectedOutput": item["expectedOutput"]})
                  print("Seeded dataset items successfully.")
              except Exception as e:
                  print(f"Failed to seed dataset items: {e}")

              print("FinServe Langfuse seeding job finished successfully.")
              EOF
              python3 /tmp/seed.py
          env:
            - name: LANGFUSE_HOST
              value: {{ include "finserve.langfuseHost" . | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.platform.langfusePublicKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.platform.langfuseSecretKey | quote }}
{{- end }}
