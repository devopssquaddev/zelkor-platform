  executor_server.py: |
    import subprocess
    import tempfile
    import os
    from fastapi import FastAPI, Request
    from pydantic import BaseModel
    import uvicorn

    app = FastAPI(title="FinServe Sandboxed Python Code Executor")

    class CodePayload(BaseModel):
        code: str

    @app.get("/health")
    async def health():
        return {"status": "ok", "service": "code-executor"}

    @app.post("/execute")
    async def execute(payload: CodePayload):
        code = payload.code
        with tempfile.NamedTemporaryFile(mode="w", suffix=".py", delete=False) as f:
            f.write(code)
            temp_path = f.name
        try:
            res = subprocess.run(
                ["python", temp_path],
                capture_output=True,
                text=True,
                timeout=5
            )
            return {
                "status": "success" if res.returncode == 0 else "error",
                "stdout": res.stdout,
                "stderr": res.stderr,
                "exit_code": res.returncode
            }
        except Exception as e:
            return {"status": "error", "error": str(e)}
        finally:
            if os.path.exists(temp_path):
                os.remove(temp_path)

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)

  agent_server.py: |
    import os
    import sys
    import json
    import logging
    from fastapi import FastAPI, Request, Header, HTTPException
    from pydantic import BaseModel
    import uvicorn

    sys.path.insert(0, "/app")
    from finserve_agent import FinServeAgent

    app = FastAPI(title="FinServe AI Agent")

    class PromptPayload(BaseModel):
        prompt: str
        thread_id: str = "default-thread"

    @app.get("/health")
    async def health():
        return {"status": "ok", "service": "finserve-agent"}

    @app.post("/chat")
    async def chat(payload: PromptPayload, request: Request, authorization: str = Header(None), x_tenant_id: str = Header(None)):
        # Extract tenant identity
        tenant_id = None
        if authorization and authorization.startswith("Bearer dev:"):
            tenant_id = authorization.split("Bearer dev:", 1)[1].strip()
        elif x_tenant_id:
            tenant_id = x_tenant_id
        else:
            tenant_id = "Bank_Alpha"  # default demo tenant

        agent = FinServeAgent(tenant_id=tenant_id)
        result = await agent.handle_prompt(payload.prompt, thread_id=payload.thread_id)
        return result

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
