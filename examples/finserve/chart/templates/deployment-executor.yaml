apiVersion: v1
kind: Service
metadata:
  name: {{ include "finserve.fullname" . }}-code-executor
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-executor
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-executor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserve.fullname" . }}-code-executor
  labels:
    {{- include "finserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-executor
spec:
  replicas: {{ .Values.executor.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "finserve.labels" . | nindent 6 }}
      app.kubernetes.io/component: code-executor
  template:
    metadata:
      labels:
        {{- include "finserve.labels" . | nindent 8 }}
        app.kubernetes.io/component: code-executor
    spec:
      {{- if .Values.executor.runtimeClassName }}
      runtimeClassName: {{ .Values.executor.runtimeClassName }}
      {{- end }}
      containers:
        - name: code-executor
          image: "{{ .Values.executor.image.repository | default "python" }}:{{ .Values.executor.image.tag | default "3.11-slim" }}"
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir fastapi uvicorn pydantic numpy pandas >/dev/null 2>&1
              python /app/executor_server.py
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: code
              mountPath: /app/executor_server.py
              subPath: executor_server.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: {{ include "finserve.fullname" . }}-code
