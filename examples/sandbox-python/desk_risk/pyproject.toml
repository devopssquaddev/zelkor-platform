[project]
name = "desk-risk"
version = "1.0.0"
description = "Portfolio helpers for the Zelkor sandbox Python example"
requires-python = ">=3.11"
dependencies = [
  "python-dateutil==4.0.0",
  "tzdata==2026.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
